<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#381578"><meta name="description" content="Stop Arena — jogo de palavras Recreativo e Educacional do AnnA EduPlay"><title>Stop Arena | AnnA EduPlay</title><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;--bg:#eff2ff;--card:#fff;--ink:#182451;--muted:#53617e;--edge:#d9def2;--accent:#7834dc;--accent2:#5122ac;--input:#f7f7ff;--ok:#167c64;--warn:#bb3154;color-scheme:light}
:root[data-theme=dark]{--bg:#14152d;--card:#20213d;--ink:#f4f2ff;--muted:#b5b6d0;--edge:#373858;--accent:#ab79ff;--accent2:#8041d7;--input:#292a48;--ok:#5fdbc0;--warn:#ff8ba6;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f4b43d;outline-offset:2px}.shell{max-width:1120px;margin:auto;padding:0 16px}.top{background:linear-gradient(110deg,#381578,#54209d 75%,#461583);color:white;border-bottom:3px solid #a25df0}.bar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:10px;text-decoration:none}.identity img{width:34px;height:34px}.identity strong{font-size:17px;line-height:1.1;display:block}.identity small{font-size:10px;color:#e7d8ff}.bar-right{display:flex;align-items:center;gap:8px}.toplink{font-size:12px;text-decoration:none;border:1px solid #b68fe8;padding:8px 10px;border-radius:9px;font-weight:750}.theme{border:1px solid #b68fe8;background:#ffffff12;color:white;padding:8px;border-radius:9px}.main{padding:17px 0 25px;min-height:70vh}.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.hrow h1{font-size:clamp(23px,3vw,30px);margin:0}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.sub{color:var(--muted);font-size:13px;margin:5px 0}.panel{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px;box-shadow:0 5px 17px #2920750d}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.gridmodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mode{display:flex;flex-direction:column;gap:8px;text-align:left;min-height:152px;border:1px solid var(--edge);background:var(--card);color:var(--ink);border-radius:14px;padding:17px}.mode strong{font-size:20px}.mode span{font-size:27px}.mode small{line-height:1.5;color:var(--muted)}.mode em{margin-top:auto;font-style:normal;font-weight:800;color:var(--accent)}.mode:hover{border-color:var(--accent)}.btn{border:0;border-radius:10px;padding:10px 15px;min-height:42px;font-weight:800}.primary{background:linear-gradient(110deg,#9d45ed,#6e2ed4);color:white}.secondary{background:var(--input);border:1px solid var(--edge);color:var(--ink)}.stop{background:#e43e70;color:white;font-size:18px;letter-spacing:.04em;min-width:135px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.actions .right{margin-left:auto}.field{display:grid;gap:5px;margin:0}.field label{font-weight:750;font-size:12px}.field input,.field select,.answer input{width:100%;min-width:0;background:var(--input);color:var(--ink);border:1px solid var(--edge);border-radius:9px;padding:10px;min-height:42px;font-size:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.wide{grid-column:1/-1}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{border:1px solid var(--edge);border-radius:8px;background:var(--input);padding:6px 9px;font-size:12px;color:var(--ink)}.chip button{border:0;background:none;color:var(--warn);font-weight:900;margin-left:6px;padding:0 2px}.preset{display:flex;flex-wrap:wrap;gap:7px}.preset button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.notice{font-size:12px;color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px}.stat{background:var(--card);border:1px solid var(--edge);border-radius:11px;padding:9px;text-align:center}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.stat strong{font-size:23px;line-height:1.25}.stat.letter{background:linear-gradient(110deg,#7540db,#9c5aee);color:#fff;border-color:transparent}.stat.letter small{color:#f0e4ff}.progress{height:5px;background:var(--edge);border-radius:8px;overflow:hidden;margin:0 0 12px}.progress>div{height:100%;background:#38baaa;transition:width .2s}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.answer label{display:block;font-weight:750;margin-bottom:4px}.answer small{color:var(--muted);font-weight:400}.gamepanel{padding:14px}.gamepanel .actions{margin-top:11px}.scoretable{width:100%;border-collapse:collapse}.scoretable th,.scoretable td{padding:9px 5px;border-bottom:1px solid var(--edge);text-align:left}.scoretable th{font-size:11px;color:var(--muted)}.scoretable td:last-child,.scoretable th:last-child{text-align:right}.scoretable select{max-width:110px;width:100%;background:var(--input);color:var(--ink);padding:7px;border:1px solid var(--edge);border-radius:8px}.score{font-size:27px;color:var(--ok);font-weight:900}.foot{border-top:1px solid var(--edge);padding:12px 0 20px;font-size:11px;color:var(--muted);display:flex;gap:8px;justify-content:space-between}.hidden{display:none}.lettergrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0}.lettergrid button{padding:8px 2px;border-radius:8px;border:1px solid var(--edge);background:var(--input);color:var(--ink);font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.summary>div{border:1px solid var(--edge);border-radius:10px;padding:12px;text-align:center}.summary strong{display:block;font-size:22px}.summary small{color:var(--muted)}@media(max-width:720px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.bar{min-height:55px}.main{padding-top:12px}}@media(max-width:480px){.shell{padding:0 10px}.panel{padding:12px}.gridmodes{gap:8px}.mode{padding:12px;min-height:142px}.mode strong{font-size:16px}.mode span{font-size:23px}.answers{grid-template-columns:1fr;gap:7px}.stat{padding:7px 4px}.stat strong{font-size:21px}.stats{gap:5px}.lettergrid{grid-template-columns:repeat(6,1fr)}.actions .right{margin-left:0}.actions .btn{flex:1}.formgrid{gap:9px}.toplink{font-size:11px}.identity strong{font-size:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Stop Arena v0.1.1 — densidade visual e digitação mobile */
.main{padding-top:12px}.hrow{margin-bottom:9px}.hrow h1{font-size:clamp(20px,2.5vw,26px)}.sub{margin:3px 0}
.panel{padding:13px}.mode{min-height:128px;padding:13px;gap:5px}.mode span{font-size:23px}
.game-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.game-head .eyebrow{font-size:10px}.game-head h1{font-size:19px;line-height:1.25;margin:2px 0}
.game-head .btn{min-height:36px;padding:7px 10px;font-size:12px;flex-shrink:0}
.game-toolbar{position:sticky;top:0;z-index:3;background:var(--bg);padding:5px 0 1px}
.stats{gap:6px;margin-bottom:7px}.stat{padding:7px 5px}.stat strong{font-size:21px}.stat.letter strong{font-size:26px}

.game-actions{position:sticky;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--edge);padding:9px 0 2px}
.game-actions .notice{font-size:11px}.game-actions .stop{margin-left:auto}
@media(min-width:560px){.answers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:559px){.answers{grid-template-columns:1fr}.gamepanel{padding:9px}.answer input{min-height:42px}.game-head h1{font-size:17px}.game-actions{padding-bottom:max(5px,env(safe-area-inset-bottom))}.game-actions .notice{display:none}.game-actions .stop{flex:1;max-width:210px}}
@media(max-width:380px){.stat strong{font-size:18px}.stat.letter strong{font-size:22px}.stat small{font-size:9px}.mode strong{font-size:15px}.mode{min-height:120px}.game-head h1{font-size:16px}}
</style></head><body>
<header class="top"><div class="shell bar"><a class="identity" href="../" aria-label="Voltar ao AnnA EduPlay"><img src="../favicon.svg" alt=""><span><strong>Stop Arena</strong><small>AnnA EduPlay · AnnA One</small></span></a><div class="bar-right"><a class="toplink" href="../">← EduPlay</a><button class="theme" id="theme" aria-label="Alternar tema">◐</button></div></div></header>
<main class="shell main" id="app" aria-live="polite"></main>
<footer class="shell foot"><span>AnnA One · Stop Arena v0.1</span><span>Jogo individual · dados locais · multiplayer em desenvolvimento</span></footer>
<script>
(()=>{
'use strict';
const KEY='anna.eduplay.stoparena.v01';
const presets={recreativo:{Clássico:['Nome','Animal','Cidade','Cor','Objeto','Alimento'],Desafio:['Profissão','Filme','Marca','Esporte','País','Fruta']},educacional:{Ciências:['Animal','Planta','Órgão do corpo','Conceito científico'],Geografia:['País','Cidade','Capital','Rio','Lugar geográfico'],Tecnologia:['Componente eletrônico','Ferramenta','Termo de programação','Dispositivo tecnológico'],Português:['Substantivo','Adjetivo','Verbo','Personagem literário']}};
const letters='ABCDEFGHILMNOPRSTUV';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const fresh=()=>({screen:'home',mode:'recreativo',preset:'Clássico',categories:[...presets.recreativo.Clássico],name:'Jogador',rounds:5,duration:90,rule:'random',round:1,letter:'',used:[],answers:[],results:[],history:[],deadline:0,score:0,endReason:''});
let s=fresh(),timer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
try{let data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&typeof data==='object'&&Array.isArray(data.categories)&&Array.isArray(data.history))s={...fresh(),...data}}catch(e){}
const title=(t,d='')=>'<div class="hrow"><div><h1>'+esc(t)+'</h1><p class="sub">'+esc(d)+'</p></div></div>';
function show(html){app.innerHTML=html;save()}
const button=(t,act,cls='secondary')=>'<button class="btn '+cls+'" data-a="'+act+'">'+t+'</button>';
const back=()=>button('← Início','home');
function renderHome(){show(title('Stop Arena','Escolha o modo e comece a jogar. Dois jeitos de aprender e se divertir.')+'<div class="gridmodes"><button class="mode" data-mode="recreativo"><span>🏆</span><strong>Recreativo</strong><small>Stop clássico com categorias divertidas e desafios de palavras.</small><em>Jogar →</em></button><button class="mode" data-mode="educacional"><span>🎓</span><strong>Educacional</strong><small>Atividades de Ciências, Geografia, Tecnologia e Português.</small><em>Aprender →</em></button></div><section class="panel"><strong>Versão 0.1 · Jogo individual</strong><p class="notice">Rodadas, letras, cronômetro e pontuação com conferência manual. Salas online, rankings coletivos e conexão ao GameLab serão implementados em versões futuras.</p><details style="margin-top:9px"><summary style="cursor:pointer;font-weight:800;color:var(--accent)">Sobre este módulo</summary><p class="notice">Stop Arena é um módulo de aprendizagem gamificada do AnnA EduPlay, ecossistema AnnA One. Projeto educacional de Elison Borges. Esta versão funciona no navegador com dados locais; não possui multiplayer, autenticação ou sincronização entre dispositivos.</p></details></section>')}
function renderSetup(){const opts=Object.keys(presets[s.mode]);show(title('Configurar partida',s.mode==='educacional'?'Modo Educacional · atividades por conteúdo':'Modo Recreativo · categorias clássicas')+'<div class="grid2"><section class="panel"><div class="formgrid"><div class="field"><label for="player">Nome ou apelido</label><input id="player" maxlength="25" value="'+esc(s.name)+'"></div><div class="field"><label for="duration">Tempo por rodada</label><select id="duration">'+[0,30,60,90,120,180,300].map(n=>'<option value="'+n+'" '+(s.duration===n?'selected':'')+'>'+(n?n+' segundos':'Sem limite')+'</option>').join('')+'</select></div><div class="field"><label for="rounds">Rodadas</label><select id="rounds">'+[1,3,5,10].map(n=>'<option '+(s.rounds===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="field"><label for="rule">Letra inicial</label><select id="rule"><option value="random" '+(s.rule==='random'?'selected':'')+'>Sorteio automático</option><option value="manual" '+(s.rule==='manual'?'selected':'')+'>Escolha manual</option></select></div></div><div class="actions">'+back()+button('Iniciar partida →','start','primary')+'</div></section><section class="panel"><strong>Conjuntos de categorias</strong><div class="preset" style="margin-top:10px">'+opts.map(p=>'<button class="chip" data-preset="'+esc(p)+'" aria-pressed="'+(s.preset===p)+'">'+esc(p)+'</button>').join('')+'</div><div id="chips" class="chips">'+s.categories.map((c,i)=>'<span class="chip">'+esc(c)+' <button data-remove="'+i+'" aria-label="Remover '+esc(c)+'">×</button></span>').join('')+'</div><div class="field"><label for="newCategory">Adicionar categoria (até 12)</label><div class="actions"><input id="newCategory" maxlength="42" placeholder="Nova categoria" style="flex:1">'+button('Adicionar','add')+'</div></div><p class="notice">As categorias podem ser alteradas antes do início. Nesta versão, a conferência de respostas é manual.</p></section></div>')}
function choose(){s.screen='letter';show(title('Rodada '+s.round+' de '+s.rounds,'Escolha uma letra para começar.')+'<section class="panel"><div class="lettergrid">'+letters.split('').map(l=>'<button data-letter="'+l+'">'+l+'</button>').join('')+'</div><div class="actions">'+button('Sortear letra','random','primary')+back()+'</div></section>')}
function nextRound(){s.answers=s.categories.map(()=>'');s.results=[];s.endReason='';let pool=letters.split('').filter(l=>!s.used.includes(l));if(!pool.length){s.used=[];pool=letters.split('')}if(s.rule==='manual'){choose()}else{begin(pool[Math.floor(Math.random()*pool.length)])}}
function begin(l){s.letter=l;if(!s.used.includes(l))s.used.push(l);s.deadline=s.duration?Date.now()+s.duration*1000:0;s.screen='game';renderGame()}
const timeText=n=>n===null?'∞':String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function remaining(){return s.duration?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):null}
function tick(){if(s.screen!=='game')return;let n=remaining();let t=document.getElementById('countdown');if(t)t.textContent=timeText(n);let bar=document.getElementById('bar');if(bar)bar.style.width=(n===null?100:n/s.duration*100)+'%';if(n===0)finish('Tempo esgotado')}
function renderGame(){
 const n=remaining();
 if(n===0){finish('Tempo esgotado');return}
 show('<div class="game-head"><div><span class="eyebrow">'+(s.mode==='educacional'?'Modo Educacional':'Modo Recreativo')+'</span><h1>Respostas com a letra '+esc(s.letter)+'</h1></div>'+button('Sair','quit')+'</div>'+
 '<div class="game-toolbar"><div class="stats">'+
 '<div class="stat letter"><small>Letra</small><strong>'+esc(s.letter)+'</strong></div>'+
 '<div class="stat"><small>Tempo</small><strong id="countdown" role="timer">'+timeText(n)+'</strong></div>'+
 '<div class="stat"><small>Rodada</small><strong>'+s.round+'/'+s.rounds+'</strong></div>'+
 '<div class="stat"><small>Preenchidas</small><strong id="filled">0/'+s.categories.length+'</strong></div>'+
 '</div><div class="progress" aria-hidden="true"><div id="bar" style="width:100%"></div></div></div>'+
 '<section class="panel gamepanel"><div class="answers">'+
 s.categories.map((c,i)=>'<div class="answer"><label for="ans'+i+'">'+esc(c)+'</label><input id="ans'+i+'" class="ans" data-i="'+i+'" maxlength="80" autocomplete="off" enterkeyhint="next" placeholder="'+esc(s.letter)+'…" value="'+esc(s.answers[i]||'')+'"></div>').join('')+
 '</div><div class="actions game-actions">'+button('Limpar','clear')+'<span class="notice">Conferência manual · 10 pontos por válida</span><button class="btn stop right" data-a="stop">✋ STOP!</button></div></section>');
 updateFilled();clearInterval(timer);timer=setInterval(tick,250)
}
function updateFilled(){let el=document.getElementById('filled');if(el)el.textContent=s.answers.filter(x=>String(x||'').trim()).length+'/'+s.categories.length}
function finish(reason){if(s.screen!=='game')return;clearInterval(timer);s.endReason=reason;s.results=s.categories.map((c,i)=>{let a=String(s.answers[i]||'').trim();return {category:c,answer:a,status:!a?'empty':norm(a).startsWith(norm(s.letter))?'valid':'invalid'}});s.screen='result';renderResult()}
const points=x=>x==='valid'?10:0;
const roundScore=()=>s.results.reduce((a,r)=>a+points(r.status),0);
function renderResult(){show(title('Conferir respostas','Letra '+s.letter+' · '+s.endReason)+'<section class="panel"><p class="notice">A conferência automática verifica apenas a letra inicial. Verifique se cada resposta realmente pertence à categoria antes de confirmar.</p><div style="overflow:auto"><table class="scoretable"><thead><tr><th>Categoria</th><th>Resposta</th><th>Avaliação</th><th>Pontos</th></tr></thead><tbody>'+s.results.map((r,i)=>'<tr><td>'+esc(r.category)+'</td><td>'+esc(r.answer||'—')+'</td><td><select data-status="'+i+'" aria-label="Validar '+esc(r.category)+'"><option value="valid" '+(r.status==='valid'?'selected':'')+'>Válida</option><option value="invalid" '+(r.status==='invalid'?'selected':'')+'>Inválida</option><option value="empty" '+(r.status==='empty'?'selected':'')+'>Vazia</option></select></td><td id="pt'+i+'">'+points(r.status)+'</td></tr>').join('')+'</tbody></table></div><div class="hrow" style="margin-top:14px"><strong>Pontos da rodada</strong><span class="score" id="roundScore">'+roundScore()+'</span></div><div class="actions">'+button('Refazer rodada','retry')+button(s.round===s.rounds?'Resultado final →':'Próxima rodada →','confirm','primary')+'</div></section>')}
function renderEnd(){let total=s.history.reduce((a,x)=>a+x.score,0);show(title('Partida concluída!','Modo '+(s.mode==='educacional'?'Educacional':'Recreativo')+' · '+esc(s.name))+'<section class="panel"><div class="score" style="font-size:44px;text-align:center">'+total+' pontos</div><div class="summary"><div><strong>'+s.history.length+'</strong><small>Rodadas</small></div><div><strong>'+Math.max(0,...s.history.map(x=>x.score))+'</strong><small>Melhor rodada</small></div><div><strong>'+Math.round(total/Math.max(s.history.length,1))+'</strong><small>Média</small></div></div><table class="scoretable"><thead><tr><th>Rodada</th><th>Letra</th><th>Válidas</th><th>Pontos</th></tr></thead><tbody>'+s.history.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.letter)+'</td><td>'+x.valid+'</td><td>'+x.score+'</td></tr>').join('')+'</tbody></table><div class="actions" style="margin-top:15px">'+back()+button('Jogar novamente','again','primary')+'</div></section>')}
function render(){clearInterval(timer);if(s.screen==='home')renderHome();else if(s.screen==='setup')renderSetup();else if(s.screen==='letter')choose();else if(s.screen==='game')renderGame();else if(s.screen==='result')renderResult();else if(s.screen==='end')renderEnd();else{s.screen='home';renderHome()}}
function start(){s.name=(document.getElementById('player')?.value||'Jogador').trim().slice(0,25)||'Jogador';s.duration=Number(document.getElementById('duration').value);s.rounds=Number(document.getElementById('rounds').value);s.rule=document.getElementById('rule').value;if(!s.categories.length){alert('Adicione ao menos uma categoria.');return}s.round=1;s.history=[];s.used=[];s.score=0;nextRound()}
app.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.mode) {
    s.mode = el.dataset.mode;
    s.preset = Object.keys(presets[s.mode])[0];
    s.categories = [...presets[s.mode][s.preset]];
    s.screen = 'setup';
    render();
    return;
  }
  if (el.dataset.preset) {
    s.preset = el.dataset.preset;
    s.categories = [...presets[s.mode][s.preset]];
    render(); return;
  }
  if (el.dataset.remove !== undefined) {
    s.categories.splice(Number(el.dataset.remove), 1);
    render(); return;
  }
  if (el.dataset.letter) { begin(el.dataset.letter); return; }
  switch (el.dataset.a) {
    case 'home':
      if (s.screen === 'game' && !confirm('Abandonar esta partida?')) return;
      s = fresh(); render(); break;
    case 'add': {
      const field = document.getElementById('newCategory');
      const value = field.value.trim();
      if (!value) return;
      if (s.categories.length >= 12) return alert('Máximo de 12 categorias.');
      if (s.categories.some(c => norm(c) === norm(value))) return alert('Categoria já adicionada.');
      s.categories.push(value.slice(0,42)); render(); break;
    }
    case 'start': start(); break;
    case 'random': {
      let pool = letters.split('').filter(l => !s.used.includes(l));
      if (!pool.length) pool = letters.split('');
      begin(pool[Math.floor(Math.random() * pool.length)]);
      break;
    }
    case 'quit':
      if (confirm('Abandonar a partida?')) { s.screen = 'home'; render(); }
      break;
    case 'clear':
      if (confirm('Limpar respostas?')) {
        s.answers = s.categories.map(() => '');
        document.querySelectorAll('.ans').forEach(x => {x.value = '';});
        updateFilled(); save();
      }
      break;
    case 'stop': finish('STOP solicitado'); break;
    case 'retry':
      s.screen = 'game';
      s.deadline = s.duration ? Date.now() + s.duration * 1000 : 0;
      render(); break;
    case 'confirm': {
      const sc = roundScore();
      s.history.push({letter:s.letter,score:sc,valid:s.results.filter(x=>x.status==='valid').length});
      s.score += sc;
      if (s.round >= s.rounds) { s.screen = 'end'; render(); }
      else { s.round++; nextRound(); }
      break;
    }
    case 'again': s.screen='setup'; render(); break;
  }
});
app.addEventListener('input',e=>{if(e.target.classList.contains('ans')){s.answers[Number(e.target.dataset.i)]=e.target.value;updateFilled();save()}});
app.addEventListener('change',e=>{if(e.target.dataset.status!==undefined){let i=Number(e.target.dataset.status);s.results[i].status=e.target.value;document.getElementById('pt'+i).textContent=points(e.target.value);document.getElementById('roundScore').textContent=roundScore();save()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('ans')){e.preventDefault();let arr=[...app.querySelectorAll('.ans')];arr[arr.indexOf(e.target)+1]?.focus()}if(e.key==='Enter'&&e.target.id==='newCategory'){e.preventDefault();app.querySelector('[data-a="add"]').click()}});
let theme='light';try{theme=localStorage.getItem('anna.eduplay.stoparena.theme')||'light'}catch(e){}document.documentElement.dataset.theme=theme;document.getElementById('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('anna.eduplay.stoparena.theme',theme)}catch(e){}});
if(s.screen==='game'&&s.duration&&remaining()===0){s.results=s.categories.map((c,i)=>{let a=String(s.answers[i]||'').trim();return{category:c,answer:a,status:!a?'empty':norm(a).startsWith(norm(s.letter))?'valid':'invalid'}});s.endReason='Tempo esgotado';s.screen='result'}
render();
})();
</script></body></html>
