/* Stop Arena v0.1.2: seleção de letras e sorteio animado */
.round-input{display:flex;gap:7px;align-items:center}.round-input input{flex:1;max-width:130px}.round-input select{flex:1}
.letter-options{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-top:8px}
.letter-option{min-height:33px;border:1px solid var(--edge);background:var(--input);color:var(--ink);border-radius:8px;font-weight:800;padding:3px;position:relative}

.letter-option:disabled{opacity:.55}
.letter-help{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:6px 0}
.letter-help button{border:0;background:transparent;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px}

.roulette-disc.rolling{animation:roulette-pulse .24s linear infinite alternate}

/* Stop Arena: identidade lúdica, dicas acessíveis e interface compacta */
:root{--bg:#f3f1ff;--card:#fffefa;--input:#faf7ff;--edge:#e4d8f9;--accent:#7732e2;--accent2:#5d27b9}
body{background:radial-gradient(circle at 9% 12%,#fbe1fa 0,transparent 33%),radial-gradient(circle at 89% 28%,#d9f5fd 0,transparent 30%),linear-gradient(180deg,#f0efff,#fff8f5 80%,#f3efff)}
:root[data-theme=dark] body{background:radial-gradient(circle at 20% 15%,#41216b 0,transparent 40%),linear-gradient(180deg,#191631,#14152d)}
.panel{background:var(--card);border:1px solid var(--edge);box-shadow:0 6px 20px #7537b31c}
.mode{position:relative;overflow:hidden;border:2px solid var(--edge);background:linear-gradient(140deg,#fff7df,#fff2f9 60%,#f2e8ff);box-shadow:0 8px 22px #7d35b91c}
.mode:nth-child(2){background:linear-gradient(140deg,#defaf8,#eaf5ff 60%,#f1e9ff)}
.mode:before{content:"✦";position:absolute;right:15px;top:7px;color:#f1aa1f;font-size:22px;opacity:.8}

.setup-categories{background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--card) 94%,#f9d4ff))}
.preset .chip{border-color:#cabaf4;background:#f4edff;color:#5125a8;transition:background .15s,transform .15s}
.preset .chip:nth-child(3n+2){background:#e7f8ff;border-color:#bde9f4;color:#156b87}
.preset .chip:nth-child(3n){background:#fff0e5;border-color:#ffddbb;color:#9d4b22}
.preset .chip[aria-pressed=true]{border-color:#7c39d7;box-shadow:inset 0 0 0 1px #7c39d7;background:#e8dcff}
.suggestion-chip{background:#eaf9f7;border-color:#b4e9dd;color:#136b61}
.selected-chip{background:#f3e8ff;border-color:#dbc6fb;color:#512599}
.suggestion-chip button{color:#008b78}.selected-chip button{color:#d84975}
.letter-option{background:linear-gradient(145deg,#fff0fa,#edf8ff);border-color:#dacbf4}
.letter-option:nth-child(4n+2){background:linear-gradient(145deg,#fff3d2,#fff9eb)}
.letter-option:nth-child(4n+3){background:linear-gradient(145deg,#e2f8f2,#f6fff9)}
.letter-option[aria-pressed=true]{background:#edeaf0;color:#747082}
.stat:nth-child(2){background:#e4f9ff;color:#075b80;border-color:#b4e6f3}
.stat:nth-child(3){background:#fff4d7;color:#855c0a;border-color:#f5e1a5}
.stat:nth-child(4){background:#e2faf2;color:#126c56;border-color:#afe7d4}
:root[data-theme=dark] .stat:nth-child(2),:root[data-theme=dark] .stat:nth-child(3),:root[data-theme=dark] .stat:nth-child(4){color:#182451}
.gamepanel{border-top:4px solid #fdac47}.answer label{color:var(--ink)}
.answer input:focus{border-color:#8b53e9;box-shadow:0 0 0 3px #9258e526}
.stop{background:linear-gradient(115deg,#fc4773,#e52959);box-shadow:0 3px 12px #fa4e8047}
.roulette-disc{border-color:#fbba49;box-shadow:0 9px 24px #df7fae62}
.roulette-panel{background:linear-gradient(145deg,var(--card),#f8ecff)}

.sigla-pop{display:none;position:absolute;z-index:20;left:0;bottom:calc(100% + 7px);min-width:168px;max-width:min(270px,80vw);width:max-content;white-space:normal;padding:9px 10px;border-radius:10px;background:#30215b;color:#fff;box-shadow:0 5px 18px #30215b40;font-size:12px;font-weight:500;line-height:1.35;pointer-events:none}

/* Orientação de seleção de letras — destaque sem ocupar espaço excessivo */
.letters-alert{display:flex;align-items:center;gap:9px;margin:10px 0 1px;padding:10px 12px;border:1px solid #f6ce75;border-left:4px solid #e4a322;border-radius:10px;background:#fff5d9;color:#704800;font-size:12px;line-height:1.4}

.validation-guide{background:#e7f5ff;border-left:4px solid #20b0d6;border-radius:9px;padding:10px;font-size:12px;color:#194b6b}.validation-table td{vertical-align:middle}.validation-table small{display:block;margin-top:3px}.validation-table select{max-width:145px}.validation-actions{margin-top:12px}.validation-actions .notice{flex:1}:root[data-theme=dark] .validation-guide{background:#1a4657;color:#ecfaff}@media(max-width:480px){.validation-table select{max-width:119px;font-size:12px}}

.coop-game-banner{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(110deg,#dafbe8,#e6f7ff);border:1px solid #ace9d4;border-radius:12px;margin-bottom:10px;color:#155b46;font-size:12px}
.coop-game-banner strong{font-size:14px}.contributor-label{font-size:11px!important;color:var(--muted)!important;margin-top:6px}

.coop-goal{text-align:center;font-weight:800;color:#0b926c}

/* Acesso à modalidade online sem alterar os modos existentes */
a.online-mode{text-decoration:none;display:flex;flex-direction:column;color:inherit;background:linear-gradient(145deg,#e7faff,#e9f5ff 60%,#f5e9ff)}

.computer-review{background:var(--card);padding:13px;border:1px solid var(--edge);border-radius:12px;margin-top:14px}

function prepareComputerAnswers(){
 const probability=({facil:.35,normal:.65,dificil:.92})[s.difficulty]??.65;
 // Conjuntos de respostas aceitas pelo próprio dicionário local.
 s.computerAnswers=s.categories.map(category=>{
  const pool=localWords[Object.keys(localWords).find(key=>norm(key)===norm(category))]||[];
  const matches=pool.filter(word=>norm(word).startsWith(norm(s.letter)));
  if(!matches.length||Math.random()>probability)return '';
  return String(matches[Math.floor(Math.random()*matches.length)]).toLocaleUpperCase('pt-BR');
 });
 s.computerResults=s.computerAnswers.map((answer,i)=>({
  category:s.categories[i],answer,status:answer?'valid':'empty',
  reason:answer?'Reconhecida no dicionário local':'Sem resposta conhecida'
 }));
}

function classify(category,answer,letter){
 const value=norm(answer);
 if(!value)return {status:'empty',reason:'Sem resposta'};
 if(!value.startsWith(norm(letter)))return {status:'invalid',reason:'Letra inicial diferente'};
 if(wordIndex[norm(category)]?.has(value))return {status:'valid',reason:'Reconhecida no dicionário local'};
 return {status:'review',reason:'Não encontrada no dicionário resumido. Pode estar correta.'};
}
async function consultAI(){
 const targets=s.results.map((r,index)=>({...r,index})).filter(r=>r.answer&&r.status!=='empty');
 const info=document.getElementById('aiFeedback');
 const btn=app.querySelector('[data-a="consultAI"]');
 if(!info||!btn)return;
 if(!targets.length){info.textContent='Não há respostas para conferir.';return}
 btn.disabled=true;info.textContent='🤖 Conferindo a escrita e a categoria de '+targets.length+' resposta(s)...';
 const expectedLetter=s.letter,expectedRound=s.round;
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{response=await fetch(AI_ENDPOINT,{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({letter:expectedLetter,items:targets.map(({index,category,answer})=>({index,category,answer}))})})}
  finally{clearTimeout(timeout)}
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error((data.error||'Serviço Gemini indisponível')+(data.diagnostico?.providerStatus?' · HTTP '+data.diagnostico.providerStatus:'')+(data.diagnostico?.detail?' · '+String(data.diagnostico.detail).slice(0,150):'')+(data.diagnostico?.type?' · '+data.diagnostico.type:''));
  if(!Array.isArray(data.suggestions))throw Error('formato da IA inesperado');
  if(s.screen!=='result'||s.round!==expectedRound||s.letter!==expectedLetter)return;
  let evaluated=0,uncertain=0;
  const eligible=new Map(targets.map(x=>[x.index,x]));
  for(const suggestion of data.suggestions){
   const index=Number(suggestion.index),target=eligible.get(index);
   if(!target||!['valid','invalid','review'].includes(suggestion.status))continue;
   const current=s.results[index];
   if(!current||current.answer!==target.answer||current.status!==target.status)continue;
   const correction=typeof suggestion.corrected==='string'?suggestion.corrected.trim().slice(0,80):'';
   const different=correction&&correction.toLocaleUpperCase('pt-BR')!==current.answer.toLocaleUpperCase('pt-BR');
   const reason='🤖 IA: '+String(suggestion.reason||'Sem justificativa').slice(0,140);
   if(different){
    current.correction=correction;
    current.status='review';
    current.reason='✍️ Grafia sugerida: '+correction+' · '+reason+' · confirme a avaliação.';
    const field=app.querySelector('[data-status="'+index+'"]');if(field)field.value='review';
    const point=document.getElementById('pt'+index);if(point)point.textContent='0 pts';
    const help=document.getElementById('reason'+index);if(help)help.textContent=current.reason;
    uncertain++;
    continue;
   }
   if(current.status!=='review')continue;
   current.reason=reason;
   const help=document.getElementById('reason'+index);
   if(help)help.textContent=reason;
   if(suggestion.status==='review'){uncertain++;continue}
   current.status=suggestion.status;
   const selector=app.querySelector('[data-status="'+index+'"]');
   if(selector)selector.value=suggestion.status;
   const point=document.getElementById('pt'+index);
   if(point)point.textContent=points(suggestion.status)?'+'+points(suggestion.status)+' pts':'0 pts';
   evaluated++;
  }
  const pending=s.results.filter(x=>x.status==='review').length;
  updateReviewSummary();
  save();
  info.textContent='✅ '+evaluated+' avaliação(ões) concluída(s) · '+uncertain+' correção(ões) ou dúvida(s) para revisar · '+pending+' pendente(s). A palavra original foi preservada.';
 }catch(error){info.textContent='⚠️ IA indisponível: '+(error.name==='AbortError'?'tempo esgotado':error.message)+'. Continue manualmente.'}
 finally{if(btn.isConnected)updateReviewSummary()}
}

const points=x=>x==='valid'?10:0;
const roundScore=()=>s.results.reduce((a,r)=>a+points(r.status),0);
function updateReviewSummary(){
 const accepted=s.results.filter(r=>r.status==='valid').length;
 const pending=s.results.filter(r=>r.status==='review').length;
 for(const [id,value] of [['reviewAccepted',accepted],['reviewPending',pending],['roundScore',roundScore()]]){const el=document.getElementById(id);if(el)el.textContent=value}
 const pendingEl=document.getElementById('pendingCount');if(pendingEl)pendingEl.textContent=pending+' resposta(s) aguardando revisão.';
 const message=document.getElementById('reviewMessage');if(message){
  message.className='review-message '+(pending?'has-pending':'all-ready');
  message.textContent=pending?'🟡 Faltam '+pending+' resposta(s) para conferir. Use a IA ou escolha a avaliação.':'🎉 Tudo conferido! Pode seguir para a próxima rodada.';
 }
 const next=app.querySelector('[data-a="confirm"]');if(next)next.disabled=pending>0;
 const ai=app.querySelector('[data-a="consultAI"]');if(ai)ai.disabled=!s.results.some(r=>r.answer&&r.status!=='empty');
}
function renderResult(){
 const pending=s.results.filter(r=>r.status==='review').length;
 const accepted=s.results.filter(r=>r.status==='valid').length;
 show('<section class="review-hero"><div class="review-top"><div><span class="play-eyebrow">🎉 Stop Arena · Conferência</span><h1>🔎 Conferindo rodada</h1><div class="review-chips"><span>🔤 Letra <b>'+esc(s.letter)+'</b></span><span>🎯 Rodada <b>'+s.round+'/'+s.rounds+'</b></span><span>✋ '+esc(s.endReason||'STOP solicitado')+'</span></div></div></div>'+
 '<div class="review-stats"><div class="review-stat accepted">✅ <b id="reviewAccepted">'+accepted+'</b> aceitas</div><div class="review-stat pending">🟡 <b id="reviewPending">'+pending+'</b> pendentes</div><div class="review-stat total">🏆 <b id="roundScore">'+roundScore()+'</b> pontos</div></div></section>'+
 '<div class="review-help">💡 <strong>Conferência inteligente:</strong> palavras reconhecidas são aceitas; outras podem ser conferidas pela IA ou por você. A decisão pode ser corrigida.</div>'+
 (s.playStyle==='coop'?'<p class="play-note">🤝 Todos colaboram e compartilham os pontos!</p>':'')+
 '<section class="review-grid" aria-label="Respostas da rodada">'+
 s.results.map((r,i)=>'<article class="review-answer" data-review-card="'+i+'"><span class="review-answer-icon" aria-hidden="true">'+categoryEmoji(r.category)+'</span><div class="review-answer-main"><strong>'+esc(r.category)+'</strong><b>'+esc(String(r.answer||'—').toLocaleUpperCase('pt-BR'))+'</b><small id="reason'+i+'">'+esc(r.reason||'Revisão manual')+'</small></div><div class="review-answer-actions">'+(String(r.answer||'').trim()?'<select data-status="'+i+'" aria-label="Avaliar '+esc(r.category)+'">':'<select disabled aria-label="Resposta vazia, sem avaliação">')+''+
 (String(r.answer||'').trim()?['valid','review','invalid']:['empty']).map(status=>'<option value="'+status+'" '+(r.status===status?'selected':'')+'>'+labels[status]+'</option>').join('')+
 '</select><strong class="review-points" id="pt'+i+'">'+(points(r.status)?'+'+points(r.status)+' pts':'0 pts')+'</strong></div></article>').join('')+'</section>'+
 (s.playStyle==='computer'?'<section class="panel computer-review"><h3>🤖 Respostas do computador</h3><p class="notice">O adversário preparou suas palavras antes da rodada.</p><div class="review-grid">'+s.computerResults.map(item=>'<div class="review-answer"><span class="review-answer-icon">'+categoryEmoji(item.category)+'</span><div class="review-answer-main"><strong>'+esc(item.category)+'</strong><b>'+esc(item.answer||'—')+'</b></div><strong class="review-points">'+(item.status==='valid'?'+10 pts':'0 pts')+'</strong></div>').join('')+'</div><p><strong>🤖 Computador: '+computerRoundScore()+' pontos nesta rodada</strong></p></section>':'')+
 '<div id="reviewMessage" class="review-message '+(pending?'has-pending':'all-ready')+'">'+(pending?'🟡 Faltam '+pending+' resposta(s) para conferir. Use a IA ou escolha a avaliação.':'🎉 Tudo conferido! Pode seguir para a próxima rodada.')+'</div>'+
 '<div class="review-toolbar"><div class="review-ai">'+button('🤖 Conferir escrita com IA','consultAI')+'<span id="aiFeedback" class="notice" role="status">'+(pending?'O Gemini ajuda na conferência; você pode corrigir a avaliação.':'Não há respostas pendentes.')+'</span></div><div class="review-buttons">'+button('🏁 Finalizar jogo','finishGame')+button('↺ Refazer','retry')+'<button class="btn primary" data-a="confirm" '+(pending?'disabled':'')+'>'+(s.round===s.rounds?'🏆 Resultado final →':'➡ Próxima rodada')+'</button></div></div>'+
 '<p id="pendingCount" class="sr-only">'+pending+' resposta(s) aguardando revisão.</p>');
}

function finalizeGameEarly(){
 if(!['roulette','letter','game','result'].includes(s.screen))return;
 const done=s.history.length,points=s.history.reduce((total,round)=>total+round.score,0);
 const question='Finalizar o jogo agora?\n\n'+
  'Rodadas concluídas: '+done+'\nPontuação acumulada: '+points+' pontos.\n\n'+
  'A rodada atual não concluída não será contabilizada.\nDeseja realmente finalizar?';
 if(!confirm(question))return;
 clearInterval(timer);
 clearInterval(rouletteTimer);rouletteTimer=null;
 cancelPreRoundCountdown();
 s.finishedEarly=true;s.screen='end';render();
}
function renderEnd(){
 const total=s.history.reduce((a,h)=>a+h.score,0),isTeam=s.playStyle==='coop',isBot=s.playStyle==='computer';
 const computerTotal=isBot?s.history.reduce((a,h)=>a+(h.botScore||0),0):0;
 const goal=Math.ceil(s.categories.length*10*s.rounds*.7);
 const contributionCounts=(s.members||[]).map((name,i)=>({name,count:s.history.reduce((n,h)=>n+(h.contributors||[]).filter(x=>x===String(i)).length,0)}));
 const headline=s.finishedEarly?'🏁 Jogo finalizado':isBot?(total>computerTotal?'🏆 Você venceu!':total<computerTotal?'🤖 O computador venceu!':'🤝 Empate!'):isTeam?(total>=goal?'🏆 Missão cumprida!':'🤝 Juntos somos mais fortes!'):'Partida concluída!';
 show(title(headline,isBot?esc(s.name)+' × Computador · '+({facil:'Fácil',normal:'Normal',dificil:'Difícil'}[s.difficulty]||'Normal'):isTeam?esc(s.teamName||'Equipe Stop')+' · meta '+goal+' pontos':'Modo '+(s.mode==='educacional'?'Educacional':'Recreativo')+' · '+esc(s.name))+
 '<section class="panel">'+
 (s.finishedEarly?'<p class="notice">Partida encerrada antes do previsto. Apenas as '+s.history.length+' rodada(s) concluída(s) entram no placar.</p>':'')+
 (isBot?'<div class="computer-score-grid"><div><small>🙋 '+esc(s.name)+'</small><strong>'+total+'</strong><span>pontos</span></div><div><small>🤖 Computador</small><strong>'+computerTotal+'</strong><span>pontos</span></div></div>':'<div class="score" style="font-size:44px;text-align:center">'+total+' pontos</div>')+
 (isTeam?'<p class="coop-goal">'+(total>=goal?'🎉 Parabéns! A equipe atingiu a meta!':'💪 A equipe chegou a '+Math.round(total/Math.max(1,goal)*100)+'% da meta. Tentem novamente!')+'</p>':'')+
 '<div class="summary"><div><strong>'+s.history.length+'</strong><small>Rodadas</small></div><div><strong>'+Math.max(0,...s.history.map(x=>x.score))+'</strong><small>Melhor rodada</small></div><div><strong>'+Math.round(total/Math.max(s.history.length,1))+'</strong><small>Média</small></div></div>'+
 (isTeam?'<div class="coop-contributions"><strong>🙌 Participação da equipe</strong><p class="notice">Registro opcional de contribuições. Todos compartilham os pontos.</p><div class="chips">'+contributionCounts.map(m=>'<span class="chip">⭐ '+esc(m.name)+': '+m.count+'</span>').join('')+'</div></div>':'')+
 '<table class="scoretable"><thead><tr><th>Rodada</th><th>Letra</th><th>Válidas</th><th>Seus pontos</th>'+(isBot?'<th>🤖 Computador</th>':'')+'</tr></thead><tbody>'+s.history.map((h,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(h.letter)+'</td><td>'+h.valid+'</td><td>'+h.score+'</td>'+(isBot?'<td>'+(h.botScore||0)+'</td>':'')+'</tr>').join('')+'</tbody></table>'+
 '<div class="actions" style="margin-top:15px">'+back()+button('Jogar novamente','again','primary')+'</div></section>');
}
function render(){document.body.classList.remove('keyboard-open');clearInterval(timer);clearInterval(rouletteTimer);cancelPreRoundCountdown();if(s.screen==='home')renderHome();else if(s.screen==='setup')renderSetup();else if(s.screen==='letter')choose();else if(s.screen==='game')renderGame();else if(s.screen==='result')renderResult();else if(s.screen==='end')renderEnd();else{s.screen='home';renderHome()}}
function start(){
 const raw=document.getElementById('rounds').value.trim();
 if(!/^\d+$/.test(raw)||Number(raw)<1||Number(raw)>50){alert('Defina de 1 a 50 rodadas.');document.getElementById('rounds').focus();return}
 if(!availableLetters().length){alert('Escolha ao menos uma letra.');return}
 captureSetup();
 if(s.categories.length<6){alert('Selecione pelo menos 6 categorias.');return}
 if(s.playStyle==='coop'&&(s.members.length<2||s.members.length>6)){alert('Informe de 2 a 6 participantes para jogar em equipe.');return}
 if(s.playStyle==='coop'&&new Set(s.members.map(norm)).size!==s.members.length){alert('Use nomes diferentes para os participantes.');return}
 s.round=1;s.history=[];s.used=[];s.score=0;s.finishedEarly=false;nextRound();
}
app.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.bot) {
    s.playStyle='computer';s.mode='recreativo';s.preset='Clássico';
    s.categories=[...presets.recreativo.Clássico];s.screen='setup';render();return;
  }
  if (el.dataset.coop) {
    // Compatibilidade com cartões antigos ou em cache; nunca iniciar o antigo modo de um aparelho.
    location.href='online/?modo=local';return;
  }
  if (el.dataset.mode) {
    s.playStyle='solo';
    s.mode = el.dataset.mode;
    s.preset = Object.keys(presets[s.mode])[0];
    s.categories = [...presets[s.mode][s.preset]];
    s.screen = 'setup';
    render();
    return;
  }
  if (el.dataset.preset) {
    captureSetup();
    s.preset = el.dataset.preset;
    render(); return;
  }
  if (el.dataset.addSuggestion !== undefined) {
    captureSetup();
    const category = el.dataset.addSuggestion;
    if (!presets[s.mode][s.preset].includes(category)) return;
    if (s.categories.some(x => norm(x) === norm(category))) return;
    if (s.categories.length >= 12) return alert('Máximo de 12 categorias.');
    s.categories.push(category);
    render(); return;
  }
  if (el.dataset.remove !== undefined) { captureSetup();
    s.categories.splice(Number(el.dataset.remove), 1);
    render(); return;
  }
  if (el.dataset.toggleLetter) {
    captureSetup();
    const l=el.dataset.toggleLetter;
    if(s.excluded.includes(l))s.excluded=s.excluded.filter(x=>x!==l);
    else if(availableLetters().length>1)s.excluded.push(l);
    else return alert('É necessário manter pelo menos uma letra.');
    render();return;
  }
  if (el.dataset.letter) { begin(el.dataset.letter); return; }
  switch (el.dataset.a) {
    case 'home':
      if (s.screen === 'game' && !confirm('Abandonar esta partida?')) return;
      s = fresh(); render(); break;
    case 'add': {
      captureSetup();
      const field = document.getElementById('newCategory');
      const value = field.value.trim();
      if (!value) return;
      if (s.categories.length >= 12) return alert('Máximo de 12 categorias.');
      if (s.categories.some(c => norm(c) === norm(value))) return alert('Categoria já adicionada.');
      s.categories.push(value.slice(0,42)); render(); break;
    }
    case 'lettersAll': captureSetup();s.excluded=[];render();break;
    case 'start': start(); break;
    case 'random': spin(); break;
    case 'beginSelected': if(s.screen==='roulette'&&!rouletteTimer)begin(s.letter);break;
    case 'finishGame': finalizeGameEarly();break;
    case 'quit':
      if (confirm('Abandonar a partida?')) { s.screen = 'home'; render(); }
      break;
    case 'clear':
      if (confirm('Limpar respostas?')) {
        s.answers = s.categories.map(() => '');
        s.contributors = s.categories.map(()=>'');
        document.querySelectorAll('.ans').forEach(x => {x.value = '';x.closest('.play-answer')?.classList.remove('is-filled')});
        updateFilled(); save();
      }
      break;
    case 'stop': finish('STOP solicitado'); break;
    case 'consultAI': consultAI();break;
    case 'retry':
      s.screen = 'game';
      s.deadline = s.duration ? Date.now() + s.duration * 1000 : 0;
      render(); break;
    case 'confirm': {
      if(s.results.some(r=>r.status==='review'))return alert('Revise todas as respostas pendentes.');
      const sc = roundScore();
      s.history.push({letter:s.letter,score:sc,botScore:s.playStyle==='computer'?computerRoundScore():0,valid:s.results.filter(x=>x.status==='valid').length,contributors:s.results.filter(x=>x.status==='valid'&&x.contributor!=='').map(x=>x.contributor)});
      s.score += sc;
      if (s.round >= s.rounds) { s.screen = 'end'; render(); }
      else { s.round++; nextRound(); }
      break;
    }
    case 'again': s.screen='setup'; render(); break;
  }
});
app.addEventListener('change',e=>{
 if(e.target.id==='roundsPreset'&&e.target.value){document.getElementById('rounds').value=e.target.value}
 if(['player','duration','rounds','roundsPreset','rule','teamName','teamMembers','difficulty'].includes(e.target.id))captureSetup();
 if(e.target.dataset.contributor!==undefined){s.contributors[Number(e.target.dataset.contributor)]=e.target.value;save()}
});
app.addEventListener('focusin',e=>{if(e.target.classList.contains('ans'))document.body.classList.add('keyboard-open')});
app.addEventListener('focusout',e=>{if(e.target.classList.contains('ans'))setTimeout(()=>{if(!app.contains(document.activeElement)||!document.activeElement.classList.contains('ans'))document.body.classList.remove('keyboard-open')},0)});
app.addEventListener('input',e=>{
 if(!e.target.classList.contains('ans'))return;
 const field=e.target;
 const upper=field.value.toLocaleUpperCase('pt-BR');
 if(field.value!==upper){
  const start=field.selectionStart,end=field.selectionEnd;
  field.value=upper;
  try{field.setSelectionRange(start,end)}catch(error){}
 }
 s.answers[Number(field.dataset.i)]=upper;
 field.closest('.play-answer')?.classList.toggle('is-filled',!!upper.trim());
 updateFilled();save();
});
app.addEventListener('change',e=>{if(e.target.dataset.status!==undefined){const i=Number(e.target.dataset.status);if(!s.results[i]||!String(s.results[i].answer||'').trim())return;s.results[i].status=e.target.value;s.results[i].reason='Revisão manual';document.getElementById('reason'+i).textContent='Decisão manual';document.getElementById('pt'+i).textContent=points(e.target.value)?'+'+points(e.target.value)+' pts':'0 pts';updateReviewSummary();save()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('ans')){e.preventDefault();let arr=[...app.querySelectorAll('.ans')];arr[arr.indexOf(e.target)+1]?.focus()}if(e.key==='Enter'&&e.target.id==='newCategory'){e.preventDefault();app.querySelector('[data-a="add"]').click()}});
let theme='light';try{theme=localStorage.getItem('anna.eduplay.stoparena.theme')||'light'}catch(e){}document.documentElement.dataset.theme=theme;document.getElementById('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('anna.eduplay.stoparena.theme',theme)}catch(e){}});
// Atualiza partidas antigas salvas antes da regra de respostas em MAIÚSCULAS.
if(Array.isArray(s.answers))s.answers=s.answers.map(value=>String(value||'').toLocaleUpperCase('pt-BR'));
if(Array.isArray(s.results))s.results=s.results.map(row=>({...row,answer:String(row.answer||'').toLocaleUpperCase('pt-BR')}));
if(!Array.isArray(s.categories))s.categories=[...presets.recreativo.Clássico];
if(s.categories.length<6){
 const defaults=presets[s.mode]?.[s.preset]||presets.recreativo.Clássico;
 for(const item of defaults){if(s.categories.length>=6)break;if(!s.categories.some(c=>norm(c)===norm(item)))s.categories.push(item)}
}
if(!Array.isArray(s.members)||s.members.length<2)s.members=['Jogador 1','Jogador 2'];
if(!Array.isArray(s.contributors))s.contributors=[];
if(!Array.isArray(s.computerAnswers))s.computerAnswers=[];
if(!Array.isArray(s.computerResults))s.computerResults=[];
if(!['facil','normal','dificil'].includes(s.difficulty))s.difficulty='normal';
if(!['coop','solo','computer'].includes(s.playStyle))s.playStyle='solo';
if(!Array.isArray(s.excluded))s.excluded=[];s.excluded=s.excluded.filter(l=>letters.includes(l));
if(s.screen==='roulette')s.screen='letter';
if(s.screen==='game'&&s.duration&&remaining()===0){s.results=s.categories.map((category,i)=>{const answer=String(s.answers[i]||'').trim();return{category,answer,...classify(category,answer,s.letter)}});s.endReason='Tempo esgotado';s.screen='result'}
render();
})();
</script></body></html>
