<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6027b6"><title>Cooperativo Online | Stop Arena · AnnA EduPlay</title>
<meta name="description" content="Stop Arena Cooperativo Online: crie uma sala e jogue em equipe no celular ou computador">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#25305d;background:#f4f3ff;--edge:#e1d6f8;--accent:#752ce1}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 5% 8%,#ffe5f6,transparent 30%),radial-gradient(circle at 90% 20%,#d8faff,transparent 28%),linear-gradient(135deg,#f4f1ff,#fff9ed)}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
header{background:linear-gradient(115deg,#45219a,#8740ed 60%,#d33dab);color:white;box-shadow:0 4px 18px #6a36b033}
.header{max-width:1120px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:900;font-size:19px}.brand small{display:block;font-weight:500;font-size:11px;color:#f5eaff}
header a{color:white;text-decoration:none;font-weight:700}
main{max-width:1120px;margin:auto;padding:20px 16px 30px}h1{font-size:clamp(23px,3.2vw,32px);margin:2px 0 5px}
p{margin:5px 0 10px;line-height:1.45}.sub,.hint{color:#596783;font-size:13px}
.panel{background:#fffefa;border:1px solid var(--edge);padding:18px;border-radius:17px;box-shadow:0 8px 24px #6c37ae18}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.stack{display:grid;gap:12px}
label{font-weight:800;font-size:12px;display:block;margin:7px 0 5px}
input,select{width:100%;min-height:43px;padding:9px 11px;border:1px solid #d6c8f2;background:#f8f6ff;border-radius:10px;color:#252850;font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #f2b447;outline-offset:2px}
.btn{padding:11px 15px;border-radius:11px;border:1px solid #d9caee;background:#f4ecff;color:#5427a5;font-weight:800;min-height:43px}
.btn.primary{border:0;color:white;background:linear-gradient(110deg,#9549e9,#6327cf);box-shadow:0 4px 12px #8445da35}
.btn.green{background:linear-gradient(110deg,#07a99b,#10bb7f);border:0;color:white}
.btn.stop{background:linear-gradient(110deg,#fa527e,#ec3263);border:0;color:white}
.btn.small{min-height:33px;padding:5px 9px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}.actions .fill{flex:1}
.fieldrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.chip{background:#ebf8f6;border:1px solid #aee5da;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;color:#166e62}
.chip button{border:0;background:transparent;color:#d63376;font-weight:900}
.notice{font-size:12px;color:#58617c}.attention{padding:11px;border-radius:10px;background:#fff1ce;border:1px solid #ffd78f;color:#7a5013;font-size:12px;margin:11px 0}
.status{margin:10px 0;padding:9px 11px;border-radius:10px;background:#e6f8ff;border-left:4px solid #32a7c8;color:#174c6a;font-size:12px}
.status.error{background:#fff0ef;border-color:#ef6e6e;color:#862a32}
.kicker{color:#7131b2;font-weight:900;font-size:12px;letter-spacing:.04em}
.roomcode{font-size:clamp(30px,6vw,56px);letter-spacing:.16em;font-weight:1000;text-align:center;color:#6733b7;background:#f3eaff;border:2px dashed #b292e7;border-radius:13px;padding:10px;margin:12px 0;user-select:all}
.member{display:flex;align-items:center;justify-content:space-between;border-radius:10px;background:#eefaf3;padding:10px 12px;margin:7px 0;color:#1c6c58;font-weight:700}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border-radius:12px;background:linear-gradient(100deg,#d4fbeb,#dff4ff);margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:13px}
.stat{text-align:center;border:1px solid #e3c9f1;background:#f3e7ff;border-radius:11px;padding:8px 4px}
.stat:nth-child(2){background:#e6f8ff}.stat:nth-child(3){background:#fff0ce}.stat:nth-child(4){background:#e1f9ed}
.stat small{display:block;font-size:10px;color:#59617d}.stat strong{display:block;font-size:clamp(17px,3vw,26px)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.answer{border:1px solid #e5d5f0;border-radius:12px;padding:10px;background:#fff}
.answer:nth-child(3n+2){background:#f5fffb}.answer:nth-child(3n){background:#fff9ed}
.answer label{font-size:13px;margin:0 0 6px}.answer input{text-transform:uppercase;font-weight:700}
.answer small{font-size:10px;color:#60718b;display:block;margin-top:5px;min-height:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #eee3fb}th{color:#63508d;font-size:11px}
table select{font-size:12px;min-height:36px;max-width:170px}
.score{text-align:center;color:#13a279;font-size:42px;font-weight:900}
.goal{text-align:center;color:#16785e;font-weight:800}
footer{border-top:1px solid #ddd1f4;text-align:center;color:#53627c;padding:14px;font-size:12px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.panel{padding:13px}.fieldrow{grid-template-columns:1fr}.header{padding:12px}.stats{gap:4px}.stat{padding:7px 2px}}

.letter-set{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;margin:8px 0}
.letter-set button{padding:5px 0;min-height:28px;border-radius:7px;border:1px solid #d2b8ee;color:#4a267e;background:#f1e6ff;font-size:12px;font-weight:800}
.letter-set button.excluded{background:#eae8ef;color:#92929a;text-decoration:line-through;opacity:.7}
@media(max-width:680px){.letter-set{grid-template-columns:repeat(9,minmax(0,1fr))}}
.review-coop-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:13px 0}.review-coop-card{padding:13px;box-shadow:none}.review-word{font-size:19px;font-weight:850;margin:6px 0;color:var(--ink)}.review-votes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.review-votes .btn{flex:1;min-width:100px}.ai-opinion{padding:9px;border-radius:10px;background:#e8f5ff;color:#245a7d;font-size:12px;line-height:1.5}.review-coop-card select{width:100%;min-height:39px;margin-top:6px}@media(max-width:650px){.review-coop-grid{grid-template-columns:1fr}}
.lobby-hero{border-radius:20px;padding:24px;background:linear-gradient(110deg,#472196,#8951d1);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.lobby-hero h1{font-size:clamp(23px,4vw,34px)}.lobby-hero p{color:#f0e8ff}.lobby-hero span{font-size:11px;font-weight:850;letter-spacing:1px}
.lobby-pin{min-width:180px;background:white;border-radius:15px;color:#3d2471;padding:15px;display:flex;flex-direction:column;align-items:center;gap:5px}
.lobby-pin strong{font-size:30px;letter-spacing:3px}.lobby-pin small{font-size:11px}
.lobby-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lobby-layout{display:grid;grid-template-columns:1fr 1.15fr;gap:15px;align-items:start}.lobby-layout .panel{margin:0}
.lobby-layout h2{font-size:19px}.lobby-player{display:flex;align-items:center;gap:10px;border:1px solid #e6ddf5;border-radius:12px;padding:9px;margin:8px 0}
.lobby-avatar{display:grid;place-items:center;background:#e9ddff;color:#5425a0;width:38px;height:38px;border-radius:50%;font-weight:900}
.lobby-player-name{display:flex;flex-direction:column;flex:1;min-width:0}.lobby-player-name strong{overflow-wrap:anywhere}.lobby-player-name small{color:#746884}
.lobby-remove{font-size:12px!important;background:#fff0f0!important;color:#9f3244!important;padding:9px!important;border:1px solid #eebbbc!important}
.lobby-details{font-size:12px;background:#f3edff;padding:10px;border-radius:10px;margin:12px 0}
.lobby-start{background:#f5f0ff;padding:13px;border-radius:12px}.lobby-start p{font-size:13px}
.lobby-feed{height:235px;overflow-y:auto;background:#f9f7ff;border:1px solid #e7def6;padding:12px;border-radius:13px}
.lobby-message{padding:6px;margin:4px 0;overflow-wrap:anywhere}.lobby-message strong{color:#6234a7}.lobby-delete{float:right;border:0;background:transparent;color:#a22c3b;font-weight:900;cursor:pointer;margin-left:8px}
.lobby-emojis{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.lobby-emojis button{font-size:22px;background:#f1eaff;border:1px solid #dbcef4;border-radius:11px;padding:7px 11px;cursor:pointer}
.lobby-compose{display:flex;gap:9px}.lobby-compose input{flex:1;min-width:0}.lobby-compose button{width:auto}
@media(max-width:720px){.lobby-layout{grid-template-columns:1fr}.lobby-pin{width:100%}.lobby-links .btn{flex:1}}

.organizer-hero{background:linear-gradient(117deg,#47229a,#6b32bc 58%,#9b55d7);border-radius:22px;color:white;padding:clamp(23px,4vw,38px);margin:0 0 17px;box-shadow:0 12px 30px #47229a24}
.organizer-hero h1{font-size:clamp(25px,4.5vw,36px);margin:8px 0;color:white}.organizer-hero p{color:#efe6ff;max-width:560px;font-size:14px}
.organizer-kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#d8ffcc}
.organizer-join{display:inline-flex;margin-top:12px;color:#45208e!important;background:#fff!important;text-decoration:none;border-radius:12px;padding:11px 14px;font-size:13px}
.organizer-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;max-width:100%}.organizer-layout>.panel{box-shadow:0 8px 25px #50358b13}
.organizer-layout .kicker{font-size:11px;letter-spacing:1.1px;color:#7137af}
.organizer-layout h2{font-size:20px}.organizer-config{min-width:0}.organizer-rules{min-width:0}
.organizer-participants{display:flex;align-items:center;gap:12px;padding:11px 15px;border:1px solid #e0d8f0;border-radius:14px;background:#fbfaff;min-height:68px}
.participant-symbol{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;background:#eee6ff;border-radius:12px;font-size:21px}
.participant-copy{display:flex;flex:1;flex-direction:column;gap:2px;min-width:0}
.participant-copy strong{font-size:14px;color:#3c2b65}
.participant-copy small{font-size:12px;color:#6a6183}
.participant-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap;min-height:38px!important;padding:8px 12px!important;font-size:12px!important;color:#6230b8!important;background:#f0e8ff!important;box-shadow:none!important}
@media(max-width:480px){.organizer-participants{flex-wrap:wrap;padding:11px}.participant-copy{min-width:150px}.participant-link{width:100%}}

.organizer-shortcuts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.organizer-shortcuts .organizer-join{margin:0;display:inline-flex;align-items:center;justify-content:center;min-height:43px}
@media(max-width:760px){.organizer-layout{grid-template-columns:1fr}.organizer-shortcuts .organizer-join{flex:1 1 210px;text-align:center}}
@media(max-width:480px){.organizer-shortcuts{flex-direction:column;align-items:stretch}.organizer-shortcuts .organizer-join{flex:none;width:100%}}
.championship-notice{display:flex;flex-direction:column;gap:5px;margin:11px 0;padding:12px;background:#f3eeff;border:1px solid #d6c3fb;border-radius:12px;color:#4c2783;font-size:12px}
.championship-notice strong{font-size:14px}.championship-notice a{color:#5d2aa9;font-weight:750}
/* Participantes em fileira horizontal, com emoji escolhido e nome. */
.lobby-layout{display:flex;flex-direction:column;align-items:stretch}
.lobby-layout>.panel{width:100%}
.lobby-player-row{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity}
.lobby-player{flex:0 0 145px;min-height:150px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:flex-start;gap:7px;padding:13px 8px;margin:0;scroll-snap-align:start}
.lobby-avatar{font-size:39px;line-height:1.2;width:64px;height:64px;border-radius:18px;background:#f0e9ff}
.lobby-player-name{align-items:center;width:100%}.lobby-player-name strong{font-size:14px;overflow-wrap:anywhere}
.lobby-remove{font-size:11px!important;padding:6px 9px!important;margin-top:auto}
@media(max-width:720px){.lobby-layout{display:flex;flex-direction:column}.lobby-player-row{gap:9px}.lobby-player{flex-basis:128px;min-height:148px}}
/* Nome ocupa o espaço principal; emoji usa apenas um seletor curto à direita. */
.name-emoji-row{display:flex;align-items:end;gap:10px}
.name-compact{flex:1;min-width:0}
.emoji-compact{width:86px;flex:0 0 86px}
.emoji-compact select{width:100%;min-height:43px;font-size:23px;text-align:center;padding:5px 9px}
@media(max-width:480px){.emoji-compact{width:78px;flex-basis:78px}}

.teacher-toggle{display:flex;align-items:center;gap:9px;margin:13px 0 2px;font-weight:700;cursor:pointer}
.teacher-toggle input{width:20px;min-height:20px;accent-color:#7130c3;flex:0 0 20px}
.custom-number{display:grid;grid-template-columns:minmax(0,1fr) 84px;column-gap:8px;min-width:0;align-items:end}
.custom-number label{grid-column:1/-1}
.custom-number select{grid-column:1;min-width:0}
.custom-number input{grid-column:2;min-width:0;margin:0;padding-inline:9px}
.custom-number input[hidden]{display:none}
.custom-number:has(input[hidden]) select{grid-column:1/-1}
.round-time-column{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin-top:12px}
.round-time-column .custom-number select,.round-time-column .custom-number input{width:100%;box-sizing:border-box}
.category-library{margin:13px 0;border:1px solid #dfd6f3;padding:11px;border-radius:12px;background:#faf8ff;max-height:190px;overflow-y:auto}
.category-library>strong,.picked-categories>strong{display:block;font-size:12px;margin-bottom:8px;color:#58428a}
.suggestion-chip{background:#f0e8ff;border:1px solid #cbb9ed;border-radius:9px;color:#5d2997;padding:7px 9px;font-size:12px;font-weight:750;cursor:pointer}
.suggestion-chip:disabled{opacity:.45;cursor:not-allowed}
.picked-categories{margin:9px 0}

/* Antessala: organizador em uma tela compacta, participante em espera focada. */
.lobby-actions-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.lobby-actions-summary .lobby-links{margin:0}
.lobby-actions-summary .lobby-details{margin:0;font-size:12px;white-space:normal}
.lobby-layout{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.lobby-layout>.panel{width:100%}
.lobby-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lobby-player-row{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 12px}
.lobby-chat-compact{max-width:100%;padding:14px!important}
.lobby-chat-compact h2{margin:0 0 8px}
.lobby-chat-compact .lobby-feed{height:100px;min-height:0;max-height:100px}
.lobby-chat-compact .lobby-emojis{margin:8px 0}
.lobby-chat-compact .lobby-emojis button{font-size:18px;padding:5px 9px}
.lobby-chat-compact .lobby-compose{margin:5px 0}
.student-waiting{text-align:center;max-width:560px;margin:28px auto;padding:36px 22px;border-radius:22px;background:white;border:1px solid #ddd0f3;box-shadow:0 10px 38px #4c258115}
.waiting-kicker{font-size:11px;letter-spacing:1px;font-weight:800;color:#6839b5}
.waiting-emoji{font-size:76px;line-height:1.4;padding:10px}
.student-waiting h1{margin:5px 0;font-size:clamp(24px,5vw,36px)}
.student-waiting>p{color:#61527f;font-size:17px}
.waiting-pulse{background:#f1eaff;color:#57339a;padding:13px;border-radius:11px;margin-top:20px}
.waiting-chat{margin:14px 0;text-align:left}
.waiting-chat summary{cursor:pointer;text-align:center;font-weight:750;padding:9px;border-radius:10px;background:#f3edff}
.waiting-chat .lobby-chat-compact{margin-top:8px}
.waiting-exit{margin-top:12px}
@media(max-width:650px){.lobby-actions-summary{align-items:stretch}.lobby-actions-summary .lobby-details{width:100%}.lobby-links{flex-wrap:wrap}.lobby-chat-compact .lobby-compose{flex-direction:row}}

/* Conferência: orientação sempre visível e parecer de IA destacado. */
.review-top-alert{position:sticky;top:8px;z-index:18;padding:13px 17px;border:2px solid #e4bb56;border-radius:13px;background:#fff3c9;box-shadow:0 8px 22px #9e732a24;margin:0 0 13px;color:#674400;font-size:14px}
.review-top-alert strong{display:block;font-size:15px}
.review-top-alert span{display:block;margin-top:4px}
.accent-guidance{padding:11px 14px;margin:12px 0 16px;background:#e9fbf0;border:1px solid #97dbb4;border-radius:11px;color:#1b6844;font-size:13px}
.review-coop-card .ai-opinion{margin:13px 0;padding:13px 15px;border-radius:12px;border:2px solid #7c4ae5;background:#f0eaff;box-shadow:0 5px 18px #6734bf20;color:#3c226d;font-size:14px;line-height:1.55}
.review-coop-card .ai-opinion strong{display:block;font-size:15px}
.review-coop-card .ai-opinion p{margin:7px 0;color:#4b3470}
.review-coop-card .ai-opinion small{display:block;font-size:12px}
/* Cerimônia de encerramento e pódio por jogador. */
.final-ceremony{position:relative;overflow:hidden;padding:clamp(18px,4vw,36px);text-align:center}
.final-header{background:linear-gradient(120deg,#4c218d,#8944d9);border-radius:18px;color:#fff;padding:22px;margin-bottom:18px}
.final-header h1{color:#fff;margin:7px 0;font-size:clamp(25px,4vw,38px)}
.final-header p{color:#f9e7ff}
.final-kicker{font-size:11px;letter-spacing:1.7px;font-weight:900;color:#ffe6a6}
.final-team-score{font-size:15px;color:#5f3c98;font-weight:850;margin:15px 0}
.final-reveal-intro{font-size:clamp(17px,3vw,22px);font-weight:850;margin:16px 0;color:#4d268b;min-height:30px}
.podium-list{display:flex;align-items:end;justify-content:center;gap:14px;flex-wrap:wrap;margin:22px 0}
.podium-rank{position:relative;flex:1 1 190px;max-width:290px;min-height:170px;padding:18px 13px;border:2px solid #d9c8ef;border-radius:17px;background:linear-gradient(180deg,#fff,#f4edff);box-shadow:0 9px 20px #4a26871a;transition:opacity .6s,transform .7s}
.podium-rank-1{border-color:#efca5a;background:linear-gradient(160deg,#fff3c0,#fffdf2);min-height:225px}
.podium-rank-2{border-color:#c8ccda;background:linear-gradient(160deg,#f1f4ff,#fff);min-height:197px}
.podium-rank-3{border-color:#d9a56c;background:linear-gradient(160deg,#fff0e1,#fff);min-height:175px}
.podium-hidden{opacity:0;transform:translateY(26px) scale(.93);pointer-events:none}
.podium-place{font-size:16px;font-weight:900;color:#4c2b7b}
.podium-avatars{font-size:clamp(30px,4vw,42px);margin:11px 0;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.podium-rank h2{font-size:clamp(15px,2vw,20px);overflow-wrap:anywhere;margin:6px 0}
.podium-points{font-weight:900;font-size:20px;color:#5327a0}
.podium-tie{background:#eae2ff;color:#582fa0;border-radius:20px;padding:7px 10px;font-size:12px}
.champion-announce{position:relative;overflow:hidden;border:2px solid #f2c64c;border-radius:22px;background:linear-gradient(110deg,#5520a3,#902fda,#b758e6);color:#fff;padding:25px 14px;margin:19px auto;max-width:660px;min-height:190px;transition:opacity .7s,transform .7s}
.champion-announce h2{color:#ffe67b;font-size:clamp(20px,4vw,30px);position:relative;z-index:2}
.champion-announce p,.champion-announce strong{font-size:clamp(17px,3vw,24px);color:white;position:relative;z-index:2}
.champion-cup{font-size:50px;animation:champ-bounce 1.25s ease-in-out infinite alternate;position:relative;z-index:2}
.firework-field{position:absolute;inset:0;pointer-events:none;z-index:1}
.firework-field i{position:absolute;left:calc(10% + var(--i)*4.4%);top:calc(12% + var(--i)*3%);width:6px;height:16px;border-radius:3px;background:var(--spark,#ffe66c);opacity:0;animation:firework-pop 1.8s ease-out infinite;animation-delay:calc(var(--i)*.12s)}
.firework-field i:nth-child(3n){--spark:#63ebff}
.firework-field i:nth-child(3n + 1){--spark:#ff86d4}
@keyframes firework-pop{0%{transform:translateY(0) scale(.2) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(-105px) scale(.9) rotate(220deg);opacity:0}}
@keyframes champ-bounce{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.14) rotate(5deg)}}

const btn=(title,act,cls='')=>'<button class="btn '+cls+'" data-act="'+act+'">'+title+'</button>';

const isLocal=Boolean(window.STOP_ARENA_LAN);
if(isLocal){
 document.title='Multiplayer Local | Stop Arena · AnnA EduPlay';

let letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let session=null,room=null,interval=null,timer=null,checking=false,working=false,lastError='',hints={},drafts=new Map(),seenVersion=-1,screen='',lobbyDraft='';
try{
 const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');
 if(saved?.code&&saved?.token&&(!queryCode||upper(queryCode)===saved.code))session=saved;
 else if(saved&&queryCode)sessionStorage.removeItem(KEY);
}catch{}
const status=(msg,isError=false)=>{let el=document.getElementById('status');if(el){el.textContent=msg||'';el.className='status'+(isError?' error':'');el.hidden=!msg}};
const saveSession=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(session))}catch{}};
const reset=()=>{session=null;room=null;screen='';seenVersion=-1;clearInterval(interval);clearInterval(timer);interval=null;timer=null;try{sessionStorage.removeItem(KEY)}catch{};renderEntry()};
async function checkReadiness(){
 const el=document.getElementById('readiness');if(!el)return;
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);
 try{
  const response=await fetch(API.replace('/room','/status'),{signal:controller.signal,credentials:'omit'});
  const data=await response.json();
  if(!response.ok||!data.online)throw Error('Serviço de salas não disponível');
  el.textContent=(window.STOP_ARENA_LAN?'✅ Anfitrião LAN conectado — jogo offline na rede':'✅ Servidor de salas disponível')+(data.ai?' · 🧠 Credencial IA presente (consulta ainda depende da API)':' · revisão manual disponível');
  el.className='status';
 }catch{
  el.textContent=window.STOP_ARENA_LAN?'⚠️ Servidor LAN indisponível. Confirme se o aplicativo anfitrião continua aberto.':'⚠️ Salas online aguardando implantação no Cloudflare. O jogo local continua disponível.';
  el.className='status error';
 }finally{clearTimeout(timeout)}
}
async function request(payload){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),14000);
 try{
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal,credentials:'omit'});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw Error(data.error||'Serviço indisponível ('+res.status+')');
  return data;
 }finally{clearTimeout(timeout)}
}
const userName=id=>room?.members.find(m=>m.id===id)?.name||'Equipe';
const playerEmojis=["😀","😎","🤓","🥳","🤖","🦊","🐼","🐯","🦁","🐸","🦄","🚀","😁","😺","🐻","🐨","🐵","🐶","🐱","🐰","🐲","🦋","🐢","🐙","🦖","🌟","🔥","⚡","🌈","🎯","🎮","🏆","💡","🍀","🍕","⚽","🎨","🎸","🧠","👽","😇","😜","🥰","😴","🦉","🐧","🐬","🦕"];
const emojiSelector=(id,value)=>'<div class="emoji-compact"><label for="'+id+'">Emoji</label><select id="'+id+'" aria-label="Escolha seu emoji">'+playerEmojis.map(e=>'<option value="'+e+'" '+(value===e?'selected':'')+'>'+e+'</option>').join('')+'</select></div>';
const allCategoryOptions=()=>[...new Set(Object.values(PRESETS[entry.mode]||{}).flat())];
const suggestedCategories=()=>allCategoryOptions().filter(x=>!categories.some(y=>y.toLocaleLowerCase('pt-BR')===x.toLocaleLowerCase('pt-BR')));
const numericField=(id,value,defaults,min,max,unit)=>'<div class="custom-number"><label for="'+id+'">'+(id==='rounds'?'Rodadas':'Tempo por rodada (segundos)')+'</label><select id="'+id+'" aria-label="Escolha '+(id==='rounds'?'rodadas':'tempo')+'">'+defaults.map(v=>'<option value="'+v+'" '+(Number(value)===v?'selected':'')+'>'+v+(unit?' '+unit:'')+'</option>').join('')+'<option value="custom" '+(defaults.includes(Number(value))?'':'selected')+'>Personalizar</option></select><input id="'+id+'Custom" type="number" min="'+min+'" max="'+max+'" value="'+value+'" '+(defaults.includes(Number(value))?'hidden':'')+' aria-label="'+(id==='rounds'?'Rodadas personalizadas':'Tempo personalizado em segundos')+'"></div>';
function captureEntry(){
 for(const [key,id] of [['name','ownerName'],['team','teamName'],['joinName','joinName'],['joinCode','joinCode'],['emoji','hostEmoji']]){
  const el=document.getElementById(id);if(el)entry[key]=(key==='name'||key==='team')?upper(el.value):el.value;
 }
 const teacherCheckbox=document.getElementById('teacherPlays');
 if(teacherCheckbox)entry.teacherPlays=teacherCheckbox.checked;
 const chatCheckbox=document.getElementById('chatAllowed');
 if(chatCheckbox)entry.chatAllowed=chatCheckbox.checked;
 for(const [key,id] of [['mode','mode'],['rounds','rounds'],['duration','duration']]){
  const el=document.getElementById(id);if(el)entry[key]=key==='mode'?el.value:Number(el.value==='custom'?(document.getElementById(id+'Custom')?.value||''):el.value);
 }
}
function renderEntry(){
 screen='entry';clearInterval(interval);clearInterval(timer);interval=null;timer=null;
 app.innerHTML=(isLocal?'<h1>🏫 Multiplayer Local</h1><p class="sub">Cada pessoa joga no próprio aparelho. Crie uma sala, compartilhe o PIN e confiram juntos as respostas.</p><div class="attention">📶 No modo LAN, conecte todos os dispositivos à mesma rede e abra o endereço do computador anfitrião. Não precisa de internet.</div>':'<section class="organizer-hero"><span class="organizer-kicker">AnnA EduPlay · Stop Arena Online</span><h1>'+(championshipMode?'🏆 Criar equipe no campeonato':'🎮 Organize sua partida')+'</h1><p>'+(championshipMode?'Esta sala fará parte de um campeonato com regras compartilhadas.':'Configure o jogo, crie a sala e compartilhe o PIN.')+'</p><div class="organizer-shortcuts"><a class="btn organizer-join" href="entrar/">🔑 Sou participante · entrar com PIN</a><a class="btn organizer-join" href="salas/">🏠 Ver todas as salas</a><a class="btn organizer-join" href="eventos/">🏆 Campeonatos</a></div></section>')+
 (isLocal?'<div id="readiness" class="status">🔄 Verificando conexão com as salas...</div>':'')+
 ''+
 '<div class="layout organizer-layout"><section class="panel organizer-config"><span class="kicker">01 · CONFIGURAR PARTIDA</span><h2>🏠 Nova sala</h2>'+
 '<div class="name-emoji-row"><div class="name-compact"><label for="ownerName">'+(isLocal?'Seu nome':'Nome do professor')+'</label><input id="ownerName" autocapitalize="characters" maxlength="25" placeholder="Nome do professor" value="'+esc(entry.name)+'"></div>'+
 (isLocal?'':emojiSelector('hostEmoji',entry.emoji))+'</div>'+
 '<label for="teamName">'+(championshipMode?'Nome da equipe':'Nome da sala')+'</label><input id="teamName" autocapitalize="characters" maxlength="35" placeholder="'+(championshipMode?'Ex.: Equipe 7º A':'Ex.: Sala de Stop do 7º ano')+'" value="'+esc(entry.team)+'">'+
 (isLocal?'':'<label class="teacher-toggle"><input type="checkbox" id="teacherPlays" '+(entry.teacherPlays?'checked':'')+'><span>O professor também vai jogar</span></label><p class="notice">Desmarcado: o professor apenas organiza e confere. A sala pode ter 1 a 49 jogadores convidados, além do organizador.</p>'+
 '<label class="teacher-toggle"><input type="checkbox" id="chatAllowed" '+(entry.chatAllowed?'checked':'')+'><span>Permitir chat e emojis na antessala</span></label><p class="notice">Disponível somente antes da partida. Ao iniciar, as conversas são encerradas.</p>')+
 (!isLocal&&championshipMode?'<div class="championship-notice"><strong>🏆 Campeonato '+esc(entry.eventCode)+'</strong><span>Esta sala seguirá as regras definidas pelo organizador do campeonato.</span><a href="eventos/">Consultar campeonato</a></div>':'')+
 '<div class="fieldrow"><div><label for="mode">Modo da partida</label><select id="mode"><option value="recreativo" '+(entry.mode==='recreativo'?'selected':'')+'>🏆 Recreativo</option><option value="educacional" '+(entry.mode==='educacional'?'selected':'')+'>🎓 Educacional</option></select></div>'+
 '</div><div class="round-time-column">'+numericField('rounds',entry.rounds,[1,3,5,10,20],1,20,'')+numericField('duration',entry.duration,[30,60,90,120,180,300],30,300,'segundos')+'</div>'+
 (isLocal?'':'</section><section class="panel organizer-rules"><span class="kicker">02 · REGRAS DO JOGO</span><h2>Letras e categorias</h2>')+
 '<div class="actions"><strong>🔠 Letras disponíveis</strong>'+btn('↺ Restaurar letras','resetLetters','small')+'</div>'+
 '<p class="notice">💡 Toque nas letras para ativar ou desativar o sorteio. Pelo menos uma precisa ficar ativa.</p>'+
 '<div class="letter-set">'+[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(x=>'<button type="button" data-letter-toggle="'+x+'" class="'+(letters.includes(x)?'active':'excluded')+'" aria-pressed="'+letters.includes(x)+'">'+x+'</button>').join('')+'</div>'+
 ''+
 '<div class="actions"><strong>🎯 Categorias da partida</strong><span class="hint">'+categories.length+' de 12</span></div>'+
 '<p class="notice">💡 Escolha de 6 a 12 categorias. Use + para incluir uma sugestão; remova das escolhidas com ×.</p>'+
 '<div class="picked-categories"><strong>Selecionadas</strong><div class="chips">'+categories.map((x,i)=>'<span class="chip">'+esc(x)+' <button type="button" data-remove="'+i+'" title="Remover categoria '+esc(x)+'">×</button></span>').join('')+'</div></div>'+
 '<div class="category-library"><strong>Adicionar categorias sugeridas</strong><div class="chips suggestion-chips">'+allCategoryOptions().map(x=>'<button type="button" class="suggestion-chip" data-add-suggestion="'+esc(x)+'" '+(categories.some(y=>y.toLocaleLowerCase('pt-BR')===x.toLocaleLowerCase('pt-BR'))||categories.length>=12?'disabled':'')+'>+ '+esc(x)+'</button>').join('')+'</div></div>'+
 '<div class="actions"><input style="flex:1;min-width:110px" id="extraCat" maxlength="42" placeholder="Ou escreva outra categoria">'+btn('Adicionar','addCat','small')+'</div>'+
 '<div class="actions">'+btn(isLocal?'🏫 Criar sala e gerar PIN':'✨ Criar sala e gerar convite','create','primary fill')+'</div></section>'+
 (isLocal?'<section class="panel"><span class="kicker">📲 ENTRAR EM UMA SALA</span>'+
 '<p class="notice">Recebeu o PIN? Digite os 7 caracteres e seu nome para entrar antes do começo.</p>'+
 '<label for="joinCode">PIN da sala (7 caracteres)</label><input id="joinCode" maxlength="7" autocapitalize="characters" placeholder="EX.: ABC1234" value="'+esc(entry.joinCode)+'">'+

 '')+
 '<p id="status" class="status" hidden></p></div>';
 if(isLocal)checkReadiness();
}
async function enter(op){
 if(working)return;captureEntry();
 if(op==='create'&&(!entry.name.trim()||!entry.team.trim()||categories.length<6||categories.length>12||!Number.isInteger(entry.rounds)||entry.rounds<1||entry.rounds>20||!Number.isInteger(entry.duration)||entry.duration<30||entry.duration>300)){status('Preencha o professor, o nome da sala, de 6 a 12 categorias, de 1 a 20 rodadas e duração de 30 a 300 segundos.',true);return}
 if(op==='join'&&(!entry.joinName.trim()||!/^[A-HJ-NP-Z2-9]{7}$/.test(upper(entry.joinCode)))){status('Informe seu nome e um código válido de 7 caracteres.',true);return}
 working=true;status('Conectando à sala...');
 try{
  const payload=op==='create'?{op,name:upper(entry.name.trim()),team:upper(entry.team.trim()),eventCode:isLocal?'':(championshipMode?entry.eventCode:''),emoji:isLocal?undefined:entry.emoji,teacherPlays:isLocal?true:entry.teacherPlays,chatAllowed:isLocal?false:entry.chatAllowed,categories,letters,rounds:entry.rounds,duration:entry.duration}:{op,code:upper(entry.joinCode),name:entry.joinName.trim()};
  const data=await request(payload);
  session={code:data.room.code,token:data.token};saveSession();room=data.room;lastError='';seenVersion=-1;renderRoom();startPolling();
 }catch(error){status(error.message,true)}finally{working=false}
}
function link(){return isLocal?location.origin+location.pathname+'?modo=local&sala='+encodeURIComponent(room.code):new URL('entrar/?sala='+encodeURIComponent(room.code),location.href).href}
async function copyPin(){
 if(!room)return;
 try{await navigator.clipboard.writeText(room.code);status('PIN '+room.code+' copiado.')}
 catch{prompt('Copie o PIN da sala:',room.code)}
}
async function share(){
 const text='Entre na equipe '+room.team+' do Stop Arena. PIN '+room.code+': '+link();
 try{if(navigator.share){await navigator.share({title:'Stop Arena Cooperativo',text,url:link()});return}
 await navigator.clipboard.writeText(text);status('Convite copiado! Envie pelo WhatsApp ou outro aplicativo.')}catch{prompt('Copie o convite:',text)}
}
function downloadMatchReport(){
 if(!room||room.stage!=='end')return;
 const rows=[['RELATÓRIO STOP ARENA'],['Sala',room.team],['PIN',room.code],
  ['Rodadas concluídas',room.history.length],['Pontos coletivos',room.score],
  ['Situação',room.finishedEarly?'Encerrada pelo professor':'Concluída'],[],
  ['JOGADORES','PONTUAÇÃO']];
 if(room.scoreTrackingComplete&&room.playerScores){
  room.members.filter(m=>m.plays!==false).sort((a,b)=>(room.playerScores[b.id]||0)-(room.playerScores[a.id]||0))
    .forEach(m=>rows.push([m.name,room.playerScores[m.id]||0]));
 }else rows.push(['Pontuação individual não disponível nesta partida']);
 rows.push([],['RODADA','LETRA','RESPOSTAS VÁLIDAS','PONTOS COLETIVOS']);
 room.history.forEach(r=>rows.push([r.round,r.letter,r.valid,r.score]));
 const csv='\uFEFF'+rows.map(row=>row.map(value=>'"'+String(value??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='stop-arena-relatorio-'+room.code+'.csv';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function setRoom(next){
 if(!next)return;
 const changed=!room||room.version!==next.version||room.stage!==next.stage;
 if(room&&(room.code!==next.code||room.round!==next.round||room.stage==='review'&&next.stage!=='review'))hints={};
 const oldStage=room?.stage;room=next;
 if(oldStage==='lobby'&&next.stage!=='lobby')lobbyDraft='';
 if(oldStage!==next.stage&&interval){
  clearInterval(interval);
  interval=setInterval(poll,next.stage==='roulette'?500:2500);
 }
 if(screen!=='room'||oldStage!==next.stage||!document.getElementById('onlineRoom')){renderRoom()}
 else if(changed){if(next.stage==='game')syncAnswers();else renderRoom()}
 seenVersion=next.version;
}
function startPolling(){
 clearInterval(interval);interval=setInterval(poll,2500);poll();
}
async function poll(){
 if(!session||checking||working)return;
 checking=true;
 const current=session;
 try{const result=await request({op:'state',...current});if(!session||session.token!==current.token)return;lastError='';setRoom(result.room);status('')}
 catch(e){
  if(!isLocal&&/não autorizado|removido pelo organizador/i.test(e.message)){
   session=null;room=null;clearInterval(interval);clearInterval(timer);interval=null;timer=null;
   try{sessionStorage.removeItem(KEY)}catch{}
   app.innerHTML='<section class="panel" style="max-width:550px;margin:35px auto;text-align:center"><h1>🚫 Acesso encerrado</h1><p>O organizador removeu sua participação desta sala. Entre em contato com ele se precisar de autorização.</p><a class="btn" href="entrar/">Voltar</a></section>';
   return;
  }
  lastError=e.message;status('Sem atualização: '+e.message,true)
 }
 finally{checking=false}
}
async function act(action,extra={}){
 if(!session||working)return;
 working=true;
 try{
  const result=await request({op:'action',...session,action,...extra});
  setRoom(result.room);lastError='';status('');
 }catch(error){status(error.message,true)}
 finally{working=false}
}
function renderRoom(){
 if(!room)return renderEntry();
 screen='room';clearInterval(timer);
 const spectator=room.members.find(m=>m.id===room.viewer)?.plays===false;
 const header=isLocal?'<div class="banner"><div><span class="kicker">🤝 '+esc(room.team)+'</span><div class="notice">PIN '+esc(room.code)+' · '+room.members.length+'/6 participantes</div></div><div class="actions" style="margin:0">'+btn('🔗 Compartilhar convite','share','small')+btn('Sair do aparelho','leave','small')+'</div></div>':'';
 let body='';
 if(room.stage==='lobby'){
 if(isLocal){  body='<section class="panel"><h1>🎊 Sala criada!</h1><p>Compartilhe o código com os participantes. O organizador inicia quando estiverem prontos.</p>'+
  '<div class="roomcode" aria-label="'+(isLocal?'PIN da sala':'Código da sala')+'">'+esc(room.code)+'</div>'+
  (isLocal?'<p class="notice">🔐 Compartilhe este PIN de 7 caracteres com seus colegas. Todos entram pelo próprio aparelho.</p>':'')+ (room.eventCode?'<p class="notice">🏆 Evento '+esc(room.eventCode)+' · até 50 equipes.</p>':'')+

function startPodiumTimer(){
 clearInterval(timer);
 if(!room||room.stage!=='end'||!room.scoreTrackingComplete||!room.playerScores||!room.history.length)return;
 const start=Number(room.endAt||Date.now());
 const update=()=>{
  if(!room||room.stage!=='end')return;
  const elapsed=Math.max(0,Date.now()-start);
  const schedule={3:1600,2:4300,1:7100};
  let current='🥁 Aguardando o resultado...';
  for(const place of [3,2,1]){
   const el=document.querySelector('[data-podium-reveal="'+place+'"]');
   if(el&&elapsed>=schedule[place]){
    el.classList.remove('podium-hidden');
    current=place===1?'🏆 O campeão está sendo revelado!':place===2?'🥈 Revelando o segundo lugar...':'🥉 Revelando o terceiro lugar...';
   }
  }
  const headline=document.getElementById('finalRevealIntro');
  if(headline)headline.textContent=elapsed>=7900?'🎊 Parabéns a todos os participantes!':current;
  const champion=document.getElementById('championAnnounce');
  if(champion&&elapsed>=7900)champion.classList.remove('podium-hidden');
  const myCard=document.getElementById('myResultCard');
  if(myCard&&elapsed>=7900)myCard.classList.remove('podium-hidden');
  if(elapsed>=9000)clearInterval(timer);
 };
 update();timer=setInterval(update,180);
}
function startRouletteTimer(){
 clearInterval(timer);
 const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 const update=()=>{
  if(!room||room.stage!=='roulette')return;
  const revealAt=Number(room.revealAt||0),startAt=Number(room.roundStartAt||0);
  const spinAt=Number(room.spinAt||revealAt-3000);
  const now=Date.now(),preparing=now<spinAt,spinning=now>=spinAt&&now<revealAt;
  const face=document.getElementById('wheelLetter');
  const message=document.getElementById('wheelMessage');
  const counter=document.getElementById('wheelSeconds');
  const disc=document.getElementById('onlineWheel');
  if(face)face.textContent=preparing?'⏳':spinning?alphabet[Math.floor(now/90)%alphabet.length]:room.letter;
  if(disc)disc.classList.toggle('spinning',spinning);
  if(message)message.textContent=preparing?'A partida vai começar!':spinning?'🎡 Sorteando a letra...':'Letra '+room.letter+'! Prepare-se para começar.';
  if(counter)counter.textContent=preparing?Math.max(0,Math.ceil((spinAt-now)/1000))+' segundos para a roleta':
   spinning?'Sorteando...':Math.max(0,Math.ceil((startAt-now)/1000))+' segundos para iniciar a rodada';
  if(now>=startAt&&!working&&!checking)poll();
 };
 update();timer=setInterval(update,120);
}
function startTimer(){

  const el=document.getElementById('countdown');
  if(el)el.textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');

}
function queueAnswer(index,value){
 const previous=drafts.get(index);
 if(previous)clearTimeout(previous.timer);
 const timer=setTimeout(async()=>{
  const item=drafts.get(index);
  if(!item)return;
  drafts.delete(index);
  try{const data=await request({op:'action',...session,action:'answer',index,value:item.value});setRoom(data.room)}
  catch(e){status('Falha ao sincronizar resposta: '+e.message,true)}
 },650);
 drafts.set(index,{timer,value});
}
async function flushDrafts(){

 for(const [index,item] of items){clearTimeout(item.timer);await request({op:'action',...session,action:'answer',index,value:item.value})}
}
async function reviewAI(){
 if(!room?.host||!session||room.stage!=='review'||working)return;
 const items=room.results.map((r,index)=>({...r,index})).filter(r=>String(r.answer||'').trim());
 if(!items.length){status('Não há palavras preenchidas para conferir.');return}
 const code=room.code,letter=room.letter,round=room.round;
 working=true;let received=0;
 try{
  for(let offset=0;offset<items.length;offset+=12){
   const batch=items.slice(offset,offset+12);
   status('🤖 Gemini: conferindo '+Math.min(offset+batch.length,items.length)+' de '+items.length+' respostas...');
   const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
   let response;
   try{response=await fetch(AI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({letter,items:batch.map(({category,answer},i)=>({index:i,category,answer}))}),credentials:'omit',signal:controller.signal})}
   finally{clearTimeout(timeout)}
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw Error((data.error||'Serviço Gemini indisponível')+(data.diagnostico?.providerStatus?' · HTTP '+data.diagnostico.providerStatus:'')+(data.diagnostico?.detail?' · '+String(data.diagnostico.detail).slice(0,150):'')+(data.diagnostico?.type?' · '+data.diagnostico.type:''));
   if(!Array.isArray(data.suggestions))throw Error('Formato inesperado da IA');
   if(!session||!room||room.code!==code||room.round!==round||room.letter!==letter||room.stage!=='review')return;
   for(const suggestion of data.suggestions){
    const index=Number(suggestion.index),initial=batch[index];
    if(!Number.isInteger(index)||!initial||!['valid','invalid','review'].includes(suggestion.status)||room.results[initial.index]?.answer!==initial.answer)continue;
    const updated=await request({op:'action',...session,action:'aiHint',index:initial.index,suggestion:{status:suggestion.status,reason:String(suggestion.reason||'').slice(0,160),corrected:String(suggestion.corrected||'').slice(0,80)}});
    if(!updated.room||updated.room.code!==code||updated.room.round!==round)break;
    room=updated.room;received++;
   }
  }
  renderRoom();status('🤖 '+received+' parecer(es) compartilhado(s). A IA ajuda na decisão, mas não modifica a palavra digitada.');
 }catch(e){
  renderRoom();status('IA indisponível: '+(e.name==='AbortError'?'tempo esgotado':e.message)+'. '+received+' parecer(es) já recebido(s). Continuem a votação.',true);
 }finally{working=false}
}

app.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.lobbyDelete!==undefined){
  if(isLocal||!room?.host||room.stage!=='lobby')return;
  return act('deleteLobbyMessage',{messageId:b.dataset.lobbyDelete});
 }
 if(b.dataset.kick!==undefined){
  if(isLocal||!room?.host||room.stage!=='lobby')return;
  if(!confirm('Remover '+b.dataset.kickName+' da sala? A pessoa não poderá voltar usando o mesmo nome.'))return;
  return act('kick',{memberId:b.dataset.kick});
 }
 if(b.dataset.lobbyEmoji!==undefined){
  if(isLocal||room?.stage!=='lobby'||room.chatAllowed===false)return;
  return act('lobbyEmoji',{text:b.dataset.lobbyEmoji});
 }
 if(b.dataset.vote!==undefined){
  if(working)return;
  return act('vote',{index:Number(b.dataset.vote),status:b.dataset.voteStatus});
 }
 if(b.dataset.addSuggestion!==undefined){
  captureEntry();const cat=b.dataset.addSuggestion;
  if(categories.length>=12)return status('Máximo de 12 categorias.',true);
  if(!categories.some(x=>x.toLocaleLowerCase('pt-BR')===cat.toLocaleLowerCase('pt-BR')))categories.push(cat);
  renderEntry();return;
 }
 if(b.dataset.letterToggle!==undefined){
  captureEntry();const letter=b.dataset.letterToggle;
  if(letters.includes(letter)){if(letters.length===1)return status('Pelo menos uma letra deve permanecer.',true);letters=letters.filter(x=>x!==letter)}
  else letters.push(letter);
  letters.sort();renderEntry();return;
 }
 if(b.dataset.remove!==undefined){captureEntry();categories.splice(Number(b.dataset.remove),1);renderEntry();return}
 if(!b.dataset.act)return;
 const action=b.dataset.act;
 if(action==='resetLetters'){captureEntry();letters=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];renderEntry();return}
 if(action==='addCat'){captureEntry();const cat=document.getElementById('extraCat')?.value.trim().slice(0,42);if(!cat)return;if(categories.length>=12)return status('Máximo de 12 categorias.',true);if(categories.some(x=>x.toLocaleLowerCase('pt-BR')===cat.toLocaleLowerCase('pt-BR')))return status('Categoria já adicionada.',true);categories.push(cat);renderEntry();return}
 if(action==='create'||action==='join')return enter(action);
 if(action==='share')return share();
 if(action==='copyPin')return copyPin();
 if(action==='leave')return reset();
 if(action==='exitMatch'){
  reset();
  if(!isLocal)location.assign(new URL('../',location.href).href);
  return;
 }
 if(action==='downloadReport')return downloadMatchReport();
 if(action==='replay'){
  if(!room?.host||room.stage!=='end')return;
  if(!confirm('Jogar novamente na mesma sala com os mesmos participantes e regras? A pontuação será zerada. Baixe o relatório anterior antes de continuar se precisar guardá-lo.'))return;
  return act('replay');
 }
 if(action==='ai'){if(window.STOP_ARENA_LAN)return status('🤖 Gemini exige internet. No modo LAN offline, use a votação e a conferência manual.',true);return reviewAI()}
 if(action==='finishGame'){
  if(!room?.host||!['lobby','roulette','game','review'].includes(room.stage))return;
  const answer='Finalizar a partida para todos os participantes?\n\n'+
   'Rodadas concluídas: '+room.history.length+'\nPontuação atual: '+room.score+
   ' pontos.\n\nA rodada atual ainda não concluída não será contabilizada.\nDeseja finalizar?';
  if(!confirm(answer))return;
  return act('close');
 }
 if(action==='stop'){try{await flushDrafts();await act('stop')}catch(err){status(err.message,true)}return}
 if(['start','next'].includes(action))return act(action);
});
app.addEventListener('submit',async e=>{
 if(e.target.id!=='lobbyForm')return;
 e.preventDefault();
 if(isLocal||room?.stage!=='lobby'||room.chatAllowed===false||working)return;
 const message=(document.getElementById('lobbyText')?.value||'').trim();
 if(!message)return;
 await act('lobbyMessage',{text:message});
 lobbyDraft='';
 const field=document.getElementById('lobbyText');if(field)field.value='';
});
app.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='mode'){captureEntry();categories=[];renderEntry();return}
 if(el.id==='rounds'||el.id==='duration'){
  const custom=document.getElementById(el.id+'Custom');
  if(custom)custom.hidden=el.value!=='custom';
  if(el.value!=='custom')entry[el.id]=Number(el.value);
  return;
 }
 if(el.dataset.grade!==undefined){if(el.value!=='review')act('grade',{index:Number(el.dataset.grade),status:el.value});return}
 if(['teacherPlays','chatAllowed','roundsCustom','durationCustom','ownerName','teamName','joinCode','joinName','hostEmoji'].includes(el.id))captureEntry();
});
app.addEventListener('input',e=>{
 if(e.target.id==='lobbyText'){lobbyDraft=e.target.value;return}
 if(e.target.dataset.answer!==undefined){
  const field=e.target,index=Number(field.dataset.answer);
  const next=upper(field.value);
  if(field.value!==next){const start=field.selectionStart,end=field.selectionEnd;field.value=next;try{field.setSelectionRange(start,end)}catch{}}
  queueAnswer(index,next);
 }
 if(['ownerName','teamName','joinCode','eventCode'].includes(e.target.id)){
  const el=e.target,next=upper(el.value);
  if(el.value!==next){
   const start=el.selectionStart,end=el.selectionEnd;
   el.value=next;
   try{el.setSelectionRange(start,end)}catch{}
  }
  if(el.id==='ownerName')entry.name=next;
  if(el.id==='teamName')entry.team=next;
 }
});
window.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)poll()});
if(session){app.innerHTML='<h1>🔄 Retomando sua sala...</h1>';startPolling()}
else renderEntry();
})();
</script></body></html>
