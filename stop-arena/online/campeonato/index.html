<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#642fc0"><title>Painel do Campeonato · Stop Arena</title>
<link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
<style>
:root{font:16px Inter,Segoe UI,Arial,sans-serif;color:#2c2550;background:#f6f3ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f6f0ff,#eaf9ff);min-height:100vh}
header{background:linear-gradient(110deg,#432394,#8741cc);color:white;padding:17px}
nav,main{max-width:1150px;margin:auto}nav{display:flex;justify-content:space-between;align-items:center;gap:12px}nav a{color:white;font-weight:750;text-decoration:none}
main{padding:20px 15px 50px}.hero{background:#fff;border:1px solid #dfd4f7;border-radius:18px;padding:22px;margin-bottom:14px}
h1{font-size:clamp(23px,4vw,32px);margin:5px 0}h2{font-size:19px;margin:10px 0}
p{font-size:14px;line-height:1.5;color:#5b5879}
button,a.action{display:inline-flex;justify-content:center;align-items:center;gap:6px;background:#7135be;color:white;border:0;border-radius:10px;text-decoration:none;padding:11px 14px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffcb60;outline-offset:2px}
input{font:inherit;border:1px solid #cdbbea;border-radius:10px;background:#fff;padding:11px;min-height:43px;max-width:100%}
label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}
.top-controls{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}.top-controls label{flex:1;min-width:180px}.top-controls input{width:100%}
.info{background:#ede7ff;padding:13px;border-radius:10px;font-size:13px}.status{min-height:22px;font-size:13px;color:#513388}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.pill{background:#eee7fb;border-radius:25px;padding:9px 13px;font-size:12px;color:#58368b}
.panel{border:1px solid #e0d6f1;background:#fff;border-radius:16px;padding:16px;margin-top:13px}
.control{padding:15px;border:1px solid #e3daf3;border-radius:12px;background:#faf8ff}
.bracket-scroll{overflow-x:auto;padding-bottom:12px}
.bracket-grid{display:flex;gap:14px;align-items:flex-start;min-width:max-content}
.round{width:240px}.round h3{font-size:14px;margin:4px 0 13px;color:#6035a6}
.match{border:1px solid #e0d5f0;border-radius:11px;padding:11px;background:#faf8ff;margin:0 0 11px}
.match small{font-size:11px;color:#6d5b87}
.team{padding:8px;margin:5px 0;background:white;border-radius:8px;border:1px solid #eae1f6;font-weight:750;font-size:12px;overflow-wrap:anywhere}
.team.winner{background:#e5faed;border-color:#9bd9b2;color:#186b42}
.match-form{border-top:1px solid #e3d8f5;padding-top:10px;display:grid;gap:9px}
.match-form input{width:100%;min-height:36px}.match-form button{width:100%}
.champion{background:#fff1c9;border:1px solid #e0c276;border-radius:13px;padding:17px;font-weight:800;margin:14px 0}
@media(max-width:650px){.round{width:210px}.hero,.panel{padding:14px}}
</style></head>
<body><header><nav><strong>🏆 AnnA EduPlay · Campeonato</strong><a href="../eventos/">← Campeonatos</a></nav></header>
<main><section class="hero"><h1>🏆 Painel do Campeonato</h1><p>Sorteio, chaveamento, controle dos confrontos e classificação até a final.</p>
<div class="top-controls"><label>Código do campeonato<input id="code" maxlength="7" autocapitalize="characters" placeholder="PIN de 7 caracteres"></label><button id="open">Abrir painel</button><a class="action" href="../eventos/">Criar campeonato</a></div><p class="status" id="status" role="status"></p></section>
<div id="panel" hidden></div>
</main>
<script>
(()=>{'use strict';
const API='https://anna-virtual-teste.elisonborg.workers.dev/stop-arena/event';
const KEY='anna.stoparena.tournament.host.';
const codeInput=document.getElementById('code'),panel=document.getElementById('panel'),status=document.getElementById('status');
const params=new URLSearchParams(location.search);
codeInput.value=(params.get('evento')||'').toUpperCase().slice(0,7);
let event=null,pollTimer=null,busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const token=()=>{try{return sessionStorage.getItem(KEY+event?.code)||''}catch{return ''}};
const notice=(value)=>{status.textContent=value||''};
async function request(data){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),14000);
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'omit',signal:controller.signal});
  const result=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(result.error||'Erro de comunicação ('+r.status+')');
  return result;
 }finally{clearTimeout(timeout)}
}
function view(){
 if(!event)return;
 const teams=event.teams||[],bracket=event.bracket,manage=!!token();
 panel.hidden=false;
 let output='<section class="panel"><h2>🏟️ '+esc(event.name)+'</h2><div class="summary">'+
 '<span class="pill">🔑 '+esc(event.code)+'</span><span class="pill">👥 '+teams.length+'/50 equipes</span>'+
 '<span class="pill">'+(bracket?(bracket.status==='finished'?'🏆 Encerrado':'🎮 Em andamento'):'📝 Inscrições abertas')+'</span></div>'+
 '<p class="info">Categorias: '+(event.config?.categories||[]).map(esc).join(' · ')+
 ' | '+event.config?.rounds+' rodada(s) de '+event.config?.duration+'s por partida</p>'+
 '<p><a class="action" href="../eventos/?evento='+encodeURIComponent(event.code)+'">Ver equipes e inscrições</a></p></section>';
 if(!bracket){
  output+='<section class="panel"><h2>🎲 Preparar chaveamento</h2><p>Após inscrever as equipes, encerre as inscrições para sortear confrontos eliminatórios. A partir daí, não será possível adicionar equipes.</p>'+
   (manage?'<div class="control"><p>Equipes inscritas: <strong>'+teams.length+'</strong>. Mínimo de 2.</p><button id="start" '+(teams.length<2?'disabled':'')+'>Encerrar inscrições e sortear</button></div>':
   '<p class="info">O sorteio é exclusivo do navegador que criou este campeonato. Não há controle de organizador nesta sessão.</p>')+'</section>';
 }else{
  if(bracket.champion)output+='<div class="champion">🏆 Campeã: '+esc(bracket.teams[bracket.champion]||'')+
   '<p>🥈 Vice-campeã: '+esc(bracket.teams[bracket.runnerUp]||'')+'</p></div>';
  output+='<section class="panel"><h2>🎯 Chaveamento eliminatório</h2>'+
   '<p>O sistema avança os vencedores quando todos os confrontos da fase forem concluídos. As vagas livres classificam a equipe automaticamente.</p>'+
   '<div class="bracket-scroll"><div class="bracket-grid">'+bracket.rounds.map((round,index)=>
    '<div class="round"><h3>'+(round.length===1?'🏆 Final':round.length===2?'Semifinais':'Fase '+(index+1))+'</h3>'+
    round.map(match=>{
     const a=bracket.teams[match.a]||'A definir',b=match.b?bracket.teams[match.b]||'A definir':'Vaga livre';
     return '<div class="match"><small>'+esc(match.id)+(match.bye?' · classificação automática':'')+'</small>'+
      '<div class="team '+(match.winner===match.a?'winner':'')+'">'+esc(a)+(match.scoreA!==null?' · '+match.scoreA:'')+'</div>'+
      '<div class="team '+(match.winner===match.b?'winner':'')+'">'+esc(b)+(match.scoreB!==null?' · '+match.scoreB:'')+'</div>'+
      (match.complete?'<small>✅ Classificada: '+esc(bracket.teams[match.winner]||'')+'</small>':
       manage&&index===bracket.rounds.length-1?'<form class="match-form" data-match="'+esc(match.id)+'">'+
       '<label>Pontos de '+esc(a)+'<input name="scoreA" type="number" min="0" max="100000" required></label>'+
       '<label>Pontos de '+esc(b)+'<input name="scoreB" type="number" min="0" max="100000" required></label>'+
       '<button type="submit">Registrar resultado</button></form>':
       '<small>⏳ Aguardando resultado</small>')+'</div>';
    }).join('')+'</div>').join('')+'</div></div></section>';
 }
 panel.innerHTML=output;
}
async function open(){
 const code=codeInput.value.trim().toUpperCase();
 if(!/^[A-HJ-NP-Z2-9]{7}$/.test(code))return notice('Informe um código válido de 7 caracteres.');
 notice('Carregando campeonato...');
 try{
  event=(await request({op:'state',code})).event;view();
  history.replaceState(null,'',location.pathname+'?evento='+code);
  notice('Painel carregado. Atualização automática a cada 5 segundos.');
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{if(!event||busy)return;try{const r=await request({op:'state',code:event.code});if(r.event.version!==event.version){event=r.event;view()}}catch{}},5000);
 }catch(e){notice(e.message)}
}
document.getElementById('open').addEventListener('click',open);
codeInput.addEventListener('input',()=>codeInput.value=codeInput.value.toUpperCase());
panel.addEventListener('click',async e=>{
 if(e.target.id!=='start'||busy||!event)return;
 if(!confirm('Encerrar inscrições e sortear os confrontos? Esta ação não pode ser desfeita.'))return;
 busy=true;
 try{const result=await request({op:'startBracket',code:event.code,hostToken:token()});event=result.event;view();notice('Chaveamento sorteado. Registre os resultados dos confrontos.')}
 catch(error){notice(error.message)}finally{busy=false}
});
panel.addEventListener('submit',async e=>{
 const form=e.target.closest('form[data-match]');if(!form)return;
 e.preventDefault();if(!event||busy)return;
 const a=Number(form.elements.scoreA.value),b=Number(form.elements.scoreB.value);
 if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>100000||b>100000)return notice('Informe pontos válidos.');
 if(a===b)return notice('Houve empate. Realize o desempate antes de confirmar o resultado.');
 if(!confirm('Confirmar este placar e classificar o vencedor?'))return;
 busy=true;
 try{const data=await request({op:'reportMatch',code:event.code,hostToken:token(),matchId:form.dataset.match,scoreA:a,scoreB:b});event=data.event;view();notice('Resultado registrado e chaveamento atualizado.')}
 catch(error){notice(error.message)}finally{busy=false}
});
if(codeInput.value)open();
})();
</script></body></html>
